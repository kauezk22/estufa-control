<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Estufa · Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a160a;--surface:#112011;--surface2:#162816;
  --border:#1a3a1a;--green:#4ade80;--greenD:#86efac;
  --amber:#fbbf24;--orange:#fb923c;--blue:#60a5fa;
  --red:#ef4444;--text:#d1fae5;--muted:#4b5563;--white:#fff;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:14px}
#app{min-height:100vh;display:flex;flex-direction:column}
.header{position:sticky;top:0;z-index:100;background:#0d1a0d;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:15px;font-weight:500;color:var(--green);letter-spacing:.12em}
.header-sub{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em}
.header-date{font-size:10px;color:var(--muted)}
.content{flex:1;padding-bottom:64px;overflow-y:auto}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0d1a0d;border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;padding:10px 0;background:transparent;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);border-top:2px solid transparent;text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s}
.nav-btn.active{color:var(--green);border-top-color:var(--green)}
.nav-icon{font-size:16px}
.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.card-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.metric-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.metric-val{font-size:15px;font-weight:500;line-height:1}
.metric-sub{font-size:9px;color:var(--muted);margin-top:3px}
label.lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px}
input,select,textarea{background:#080e08;border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);width:100%;font-family:'DM Mono',monospace;font-size:13px;outline:none;transition:border-color .15s;appearance:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:#166534}
select option{background:#0a160a}
textarea{resize:vertical;min-height:60px}
.btn{border:none;border-radius:8px;padding:11px 16px;cursor:pointer;font-family:'DM Mono',monospace;font-weight:500;font-size:13px;width:100%;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-blue{background:#2563eb;color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-sm{padding:5px 10px;font-size:11px;width:auto;border-radius:6px}
.btn-danger{background:#3b0000;color:#fca5a5;border:none;border-radius:6px;padding:5px 9px;cursor:pointer;font-size:11px;font-family:'DM Mono',monospace}
.section-box{border-radius:10px;padding:12px;margin-bottom:10px}
.section-merc{border:1px solid #60a5fa33;background:#60a5fa08}
.section-ceasa{border:1px solid #fbbf2433;background:#fbbf2408}
.badge{display:inline-block;font-size:9px;border-radius:4px;padding:2px 6px;white-space:nowrap}
.divider{height:1px;background:var(--border);margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row-item{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.tag{font-size:9px;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
/* modal */
.overlay{position:fixed;inset:0;background:#000000cc;z-index:200;display:flex;align-items:flex-end}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px 32px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:16px}
.modal-close{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;float:right;margin-top:-2px}
/* charts */
.bar-wrap{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.bar{border-radius:3px 3px 0 0;width:100%;min-height:2px;transition:height .3s}
.bar-label{font-size:8px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.progress-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:3px}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
/* estufa card */
.estufa-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.estufa-num{font-size:10px;color:var(--muted);margin-bottom:2px}
.estufa-dias{font-size:26px;font-weight:500;line-height:1.1}
.estufa-unit{font-size:9px;color:var(--muted)}
/* ocorrencias */
.occ-item{padding:10px 0;border-bottom:1px solid var(--border)}
.occ-item:last-child{border-bottom:none}
.severity-leve{color:#86efac}
.severity-moderada{color:#fbbf24}
.severity-grave{color:#ef4444}
/* loading */
.loading{height:100vh;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:13px}
.empty{text-align:center;padding:32px;color:var(--muted);font-size:12px;line-height:1.8}
input[type=number]::-webkit-inner-spin-button{opacity:.3}
.confirm-overlay{position:fixed;inset:0;background:#000000cc;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:280px;text-align:center}
.confirm-msg{font-size:13px;color:var(--text);margin-bottom:20px;line-height:1.6}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#1e3a1e;border-radius:2px}
/* ver mais btn */
.btn-ver-mais{width:100%;padding:10px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;margin-top:8px;text-align:center;display:block}
/* sub-view pill toggle */
.pill-toggle{display:flex;gap:6px;margin-bottom:4px}
.pill-btn{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:all .15s}
.pill-btn.active{border-color:var(--green);background:#16a34a22;color:var(--green)}
/* produto info box */
.prod-info-box{padding:8px 10px;background:#080e08;border-radius:8px;border:1px solid var(--border);margin-bottom:8px}
.total-box{padding:8px 10px;background:#080e08;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div id="app"><div class="loading">carregando...</div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc,
  doc, onSnapshot, query, orderBy, serverTimestamp, Timestamp
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ─── Firebase Config ──────────────────────────────────────────────────────────
const app = initializeApp({
  apiKey: "AIzaSyD5O_BKJW3gAne5uxGxvLffGnuY0tpH-hU",
  authDomain: "estufa-gestao.firebaseapp.com",
  projectId: "estufa-control",
  storageBucket: "estufa-control.firebasestorage.app",
  messagingSenderId: "1034393767324",
  appId: "1:1034393767324:web:0153fd2de071ed77004c59"
});
const db = getFirestore(app);

// ─── Constants ────────────────────────────────────────────────────────────────
const N_ESTUFAS = 6;
const CAT_CUSTOS = {
  'Defensivos':        ['Inseticida','Herbicida','Fungicida','Nematicida Químico','Nematicida Biológico','Adjuvante/Espalhante'],
  'Fertilizantes':     ['Sais','Orgânico','Foliar'],
  'Corretivos Solo':   ['Esterco','Condicionador de Solo','Gesso Agrícola','Calcário'],
  'Biológicos Solo':   ['EM1','Trichoderma','Solubilizador de Fósforo','Outros'],
  'Mudas':             ['Pé Franco','Porta-enxerto'],
  'Insumos Gerais':    ['Fitilhos','EPIs','Gasolina e Óleo 2T'],
  'Manutenção':        ['Estufas','Equipamentos'],
  'Fixos':             ['Energia','Mão de Obra'],
  'Financeiro':        ['Retirada Sócios','Outros'],
};
const CAT_INSUMOS = Object.keys(CAT_CUSTOS);
const TIPOS_OCC = ['Doença','Praga','Deficiência Nutricional','Problema Estrutural','Outro'];
const SEV = ['leve','moderada','grave'];
const LISTA_N = 5; // itens visíveis por padrão nas listas

// ─── State ────────────────────────────────────────────────────────────────────
const S = {
  tab: 'painel',
  periodo: 'mes',
  verMais: { colheitas: false, custos: false, vencer: false },
  custoView: 'lancar',
  fertTab: 'programa',
  fertEstufa: null,
  fertSemana: 3,
  fertCurva: 'marco-alvarenga',
  modal: null,
  modalData: {},
  ciclos: [],
  colheitas: [],
  custos: [],
  ocorrencias: [],
  produtos: [],
  ready: false,
};

// ─── Helpers ──────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,9);
const today = () => new Date().toISOString().slice(0,10);
const fmt$ = n => (+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const fmtD = s => s ? s.slice(0,10).split('-').reverse().join('/') : '—';
const fmtMes = s => { const [y,m]=s.split('-'); const ms=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return ms[+m-1]+'/'+y.slice(2); };
const parseDate = s => { const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d); };
const diasEntre = (a,b) => Math.round((parseDate(b)-parseDate(a))/864e5);
const diasDesde = s => { if(!s)return null; return diasEntre(s, today()); };
const mesDe = s => s ? s.slice(0,7) : '';
const mesAtual = () => today().slice(0,7);

// Nome de exibição de custo — suporta produto do catálogo e lançamento avulso
const nomeCusto = c => c.nomeProduto || c.descricao || c.categoria || '—';
// Detalhe de custo com produto
const detalheCusto = c => c.qtd ? `${c.qtd} ${c.unidadeProduto||'un.'} × ${fmt$(c.precoUnit)}` : '';

// ─── Helper: botão "Ver mais / Ver menos" ─────────────────────────────────────
function btnVerMais(expanded, total, key) {
  if(total <= LISTA_N) return '';
  const resto = total - LISTA_N;
  return `<button class="btn-ver-mais" data-vermais="${key}">
    ${expanded ? '▲ Ver menos' : `▼ Ver mais ${resto} registro${resto>1?'s':''}`}
  </button>`;
}

function getFase(dias) {
  if(dias===null) return {label:'Sem ciclo',color:'var(--muted)',ring:'var(--border)'};
  if(dias<0)      return {label:'Futuro',   color:'#818cf8',ring:'#3730a3'};
  if(dias<=20)    return {label:'Muda',     color:'var(--amber)',ring:'#92400e'};
  if(dias<=60)    return {label:'Crescimento',color:'var(--greenD)',ring:'#14532d'};
  if(dias<=100)   return {label:'Produção', color:'var(--green)',ring:'#166534'};
  return               {label:'Col. Final', color:'var(--orange)',ring:'#7c2d12'};
}

const recMerc  = c => (c.merc_g_q||0)*(c.merc_g_p||0);
const isPago   = c => !c.status || c.status==='pago';
const recCeasa = c => (c.cea_g_q||0)*(c.cea_g_p||0)+(c.cea_m_q||0)*(c.cea_m_p||0)+(c.cea_mi_q||0)*(c.cea_mi_p||0);
const recTotal = c => recMerc(c)+recCeasa(c);
const cxTotal  = c => (c.merc_g_q||0)+(c.cea_g_q||0)+(c.cea_m_q||0)+(c.cea_mi_q||0);

function cicloAtivo(estufa) {
  return S.ciclos.find(c=>c.estufa===estufa && !c.encerrado) || null;
}

function ocorrenciasDosCiclos(ids) {
  return S.ocorrencias.filter(o=>ids.includes(o.cicloId));
}

// ─── Render engine ────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('app');
  if(!S.ready){ root.innerHTML='<div class="loading">carregando...</div>'; return; }
  root.innerHTML = `
    ${renderHeader()}
    <div class="content">${renderContent()}</div>
    ${renderNav()}
    ${S.modal ? renderModal() : ''}
  `;
  attachEvents();
}

function renderHeader() {
  const d = new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
  return `<div class="header">
    <div><div class="header-title">ESTUFA</div><div class="header-sub">Gestão da Operação</div></div>
    <div class="header-date">${d}</div>
  </div>`;
}

function renderNav() {
  const tabs = [
    {id:'painel',  icon:'◉', label:'Painel'},
    {id:'colheita',icon:'⬡', label:'Colheita'},
    {id:'custos',  icon:'◈', label:'Custos'},
    {id:'estufas', icon:'⬜', label:'Estufas'},
    {id:'analises',icon:'◧', label:'Análises'},
    {id:'fertig',  icon:'◫', label:'Fertig'},
  ];
  return `<nav class="nav">${tabs.map(t=>`
    <button class="nav-btn${S.tab===t.id?' active':''}" data-tab="${t.id}">
      <span class="nav-icon">${t.icon}</span>${t.label}
    </button>`).join('')}</nav>`;
}

function renderContent() {
  switch(S.tab) {
    case 'painel':   return renderPainel();
    case 'colheita': return renderColheita();
    case 'custos':   return renderCustos();
    case 'estufas':  return renderEstufas();
    case 'analises': return renderAnalises();
    case 'fertig':   return renderFertig();
    default:         return '';
  }
}

// ─── PAINEL ──────────────────────────────────────────────────────────────────
function getPeriodoLabel() {
  if(S.periodo==='mes') return 'Mês Atual';
  if(S.periodo==='trimestre') return 'Últimos 3 Meses';
  if(S.periodo==='ano') return 'Ano Atual';
  return 'Acumulado';
}

function filtrarPeriodo(arr) {
  if(S.periodo==='acumulado') return arr;
  const mes = mesAtual();
  const [y,m] = mes.split('-').map(Number);
  if(S.periodo==='mes') return arr.filter(c=>mesDe(c.data)===mes);
  if(S.periodo==='ano') return arr.filter(c=>c.data&&c.data.startsWith(String(y)));
  const meses = [];
  for(let i=0;i<3;i++){
    let mm = m-i; let yy = y;
    if(mm<=0){ mm+=12; yy--; }
    meses.push(`${yy}-${String(mm).padStart(2,'0')}`);
  }
  return arr.filter(c=>meses.includes(mesDe(c.data)));
}

function renderPainel() {
  const colMes = filtrarPeriodo(S.colheitas).filter(isPago);
  const cusMes = filtrarPeriodo(S.custos).filter(c=>c.data<=today());
  const recM   = colMes.reduce((a,c)=>a+recMerc(c),0);
  const recC   = colMes.reduce((a,c)=>a+recCeasa(c),0);
  const rec    = recM+recC;
  const cus    = cusMes.reduce((a,c)=>a+c.valor,0);
  const res    = rec-cus;
  const mar    = rec>0?(res/rec*100):0;

  const tMG  = colMes.reduce((a,c)=>a+(c.merc_g_q||0),0);
  const tCG  = colMes.reduce((a,c)=>a+(c.cea_g_q||0),0);
  const tCM  = colMes.reduce((a,c)=>a+(c.cea_m_q||0),0);
  const tCmi = colMes.reduce((a,c)=>a+(c.cea_mi_q||0),0);

  const ultimasCol = [...S.colheitas].sort((a,b)=>b.data.localeCompare(a.data)).slice(0,5);

  return `<div class="pad">
    <div style="display:flex;gap:6px;margin-bottom:4px">
      ${['mes','trimestre','ano','acumulado'].map(p=>`
        <button data-periodo="${p}" style="flex:1;padding:8px 4px;border-radius:8px;border:1px solid ${S.periodo===p?'var(--green)':'var(--border)'};background:${S.periodo===p?'#16a34a22':'transparent'};color:${S.periodo===p?'var(--green)':'var(--muted)'};font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em">
          ${p==='mes'?'Mês':p==='trimestre'?'Trim.':p==='ano'?'Ano':'Total'}
        </button>`).join('')}
    </div>
    <div>
      <div class="card-title">Estufas</div>
      <div class="grid3">${Array.from({length:N_ESTUFAS},(_,i)=>{
        const ci = cicloAtivo(i+1);
        const dias = ci ? diasDesde(ci.plantio) : null;
        const fase = getFase(dias);
        return `<div class="estufa-card" style="border-color:${fase.ring}">
          <div class="estufa-num">Estufa ${i+1}</div>
          <div class="estufa-dias" style="color:${fase.color}">${dias!==null?dias:'—'}</div>
          ${dias!==null?'<div class="estufa-unit">dias</div>':''}
          <div class="badge" style="background:${fase.ring}55;color:${fase.color};margin-top:5px">${fase.label}</div>
          ${ci&&ci.variedade?`<div style="font-size:9px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ci.variedade}</div>`:''}
          ${ci&&ci.primeiraColheita?`<div style="font-size:9px;color:var(--greenD);margin-top:3px">Prod. há ${diasDesde(ci.primeiraColheita)}d</div>`:''}
        </div>`;
      }).join('')}</div>
    </div>

    <div class="grid2">
      ${metric(`Receita — ${getPeriodoLabel()}`,fmt$(rec),'var(--green)')}
      ${metric('Resultado',fmt$(res),res>=0?'var(--green)':'var(--red)')}
      ${metric('Mercado',fmt$(recM),'var(--blue)',rec>0?`${(recM/rec*100).toFixed(0)}% da receita`:'')}
      ${metric('CEASA',fmt$(recC),'var(--amber)',rec>0?`${(recC/rec*100).toFixed(0)}% da receita`:'')}
      ${metric(`Custos — ${getPeriodoLabel()}`,fmt$(cus),'var(--orange)')}
      ${metric('Margem',`${mar.toFixed(1)}%`,mar>=0?'var(--green)':'var(--red)')}
    </div>

    ${(()=>{
      const acumulado = S.colheitas.filter(isPago).reduce((a,c)=>a+recTotal(c),0) - S.custos.filter(c=>c.data<=today()).reduce((a,c)=>a+c.valor,0);
      const now = today();
      const [y,m] = mesAtual().split('-').map(Number);
      const futuroArr = S.periodo==='mes'? S.custos.filter(c=>c.data>now&&c.data.slice(0,7)===mesAtual())
        : S.periodo==='trimestre'? (()=>{const d=new Date();d.setMonth(d.getMonth()+3);return S.custos.filter(c=>c.data>now&&c.data<=d.toISOString().slice(0,10));})()
        : S.periodo==='ano'? S.custos.filter(c=>c.data>now&&c.data.startsWith(String(y)))
        : S.custos.filter(c=>c.data>now);
      const futuro = futuroArr.reduce((a,c)=>a+c.valor,0);
      const saldoLivre = acumulado - futuro;
      return `<div class="card" style="border-color:${saldoLivre>=0?'#166534':'#7f1d1d'}">
        <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px">Saldo Futuro — ${getPeriodoLabel()}</div>
        <div class="grid3" style="text-align:center">
          <div><div style="font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase">Acumulado</div><div style="font-size:13px;font-weight:500;color:var(--green)">${fmt$(acumulado)}</div></div>
          <div><div style="font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase">Compromissos</div><div style="font-size:13px;font-weight:500;color:var(--orange)">− ${fmt$(futuro)}</div></div>
          <div><div style="font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase">Saldo Livre</div><div style="font-size:15px;font-weight:500;color:${saldoLivre>=0?'var(--green)':'var(--red)'};">${fmt$(saldoLivre)}</div></div>
        </div>
      </div>`;
    })()}
    <div class="card">
      <div class="card-title">Caixas — ${getPeriodoLabel()}</div>
      <div style="margin-bottom:10px">
        <div style="font-size:9px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Supermercado</div>
        <span style="font-size:24px;font-weight:500;color:var(--blue)">${tMG}</span>
        <span style="font-size:10px;color:var(--muted);margin-left:6px">cx Graúdo</span>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px">
        <div style="font-size:9px;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">CEASA</div>
        <div class="grid3" style="text-align:center">
          ${[['Graúdo',tCG,'var(--green)'],['Médio',tCM,'var(--greenD)'],['Miúdo',tCmi,'var(--amber)']].map(([n,v,c])=>`
            <div><div style="font-size:20px;font-weight:500;color:${c}">${v}</div><div style="font-size:9px;color:var(--muted);margin-top:2px">${n}</div></div>`).join('')}
        </div>
      </div>
      <div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px">
        <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Total geral (Mercado + CEASA)</div>
        <div class="grid3" style="text-align:center">
          ${(()=>{ const tot=(tMG+tCG)+tCM+tCmi||1; return [['Graúdo',tMG+tCG,'var(--green)'],['Médio',tCM,'var(--greenD)'],['Miúdo',tCmi,'var(--amber)']].map(([n,v,c])=>`
            <div>
              <div style="font-size:20px;font-weight:500;color:${c}">${v}</div>
              <div style="font-size:10px;color:${c};margin-top:1px">${(v/tot*100).toFixed(0)}%</div>
              <div style="font-size:9px;color:var(--muted);margin-top:1px">${n}</div>
            </div>`).join(''); })()}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Últimas Colheitas</div>
      ${ultimasCol.length===0?'<div class="empty">Nenhuma colheita ainda.</div>':
      ultimasCol.map(c=>`
        <div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:12px;color:var(--text)">${fmtD(c.data)}</div>
          <div style="font-size:13px;color:var(--green);font-weight:500">${fmt$(recTotal(c))}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

function metric(label,val,color,sub='') {
  return `<div class="metric">
    <div class="metric-label">${label}</div>
    <div class="metric-val" style="color:${color}">${val}</div>
    ${sub?`<div class="metric-sub">${sub}</div>`:''}
  </div>`;
}

// ─── COLHEITA ────────────────────────────────────────────────────────────────

    <div class="card">

        <div style="display:grid;grid-template-columns:72px 1fr 1fr;gap:8px;align-items:end">

        ${[['Graúdo','var(--green)','cea-g'],['Médio','var(--greenD)','cea-m'],['Miúdo','var(--amber)','cea-mi']].map(([lbl,col,id])=>`
          <div style="display:grid;grid-template-columns:72px 1fr 1fr;gap:8px;align-items:end;margin-bottom:8px">
            <div style="font-size:12px;color:${col};font-weight:500;padding-bottom:9px">${lbl}</div>
            <div><label class="lbl">Caixas</label><input type="number" min="0" id="${id}-q" placeholder="0"></div>
            <div><label class="lbl">R$/cx</label><input type="number" min="0" step="0.01" id="${id}-p" placeholder="0,00"></div>

      <div id="col-preview" style="display:none;margin-bottom:12px;padding:10px 12px;background:#080e08;border-radius:8px;border:1px solid var(--border)">

        <div class="row">
          <div style="font-size:11px;color:var(--muted)" id="col-preview-cx"></div>

      <div style="margin-bottom:12px">

            <input type="radio" name="col-status" value="pago" checked style="display:none"> ✓ Pago
          </label>
          <label id="lbl-col-apagar" style="display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;cursor:pointer;flex:1;background:#080e08;border:2px solid var(--border);border-radius:8px;padding:10px;color:var(--muted);font-family:'DM Mono',monospace">
            <input type="radio" name="col-status" value="a-pagar" style="display:none"> ○ A Pagar

              <div class="row" style="gap:8px">

}

// ─── CUSTOS ──────────────────────────────────────────────────────────────────
function renderCustos() {
  const mes = mesAtual();
  const cusMes = S.custos.filter(c=>mesDe(c.data)===mes);
  const totalMes = cusMes.reduce((a,c)=>a+c.valor,0);
  const porCat = CAT_INSUMOS
    .map(cat=>{
      const subs = (CAT_CUSTOS[cat]||[]).map(sub=>({
        sub, total: cusMes.filter(c=>c.categoria===cat&&c.subcategoria===sub).reduce((a,c)=>a+c.valor,0)
      })).filter(x=>x.total>0);
      return {cat, total:cusMes.filter(c=>c.categoria===cat).reduce((a,c)=>a+c.valor,0), subs};
    })
    .filter(x=>x.total>0).sort((a,b)=>b.total-a.total);

  const recentes = [...S.custos].sort((a,b)=>b.data.localeCompare(a.data));
  const aVencer = recentes.filter(c=>{
    if(c.data<=today()) return false;
    const limite = new Date(); limite.setMonth(limite.getMonth()+3);
    return c.data <= limite.toISOString().slice(0,10);
  });
  const passados = recentes.filter(c=>c.data<=today());

  const visivelVencer = S.verMais.vencer ? aVencer : aVencer.slice(0, LISTA_N);
  const visivelCustos = S.verMais.custos ? passados : passados.slice(0, LISTA_N);

  // Toggle sub-view Lançar / Catálogo
  const tabToggle = `<div class="pill-toggle">
    <button data-custo-view="lancar" class="pill-btn${S.custoView==='lancar'?' active':''}">Lançar</button>
    <button data-custo-view="produtos" class="pill-btn${S.custoView==='produtos'?' active':''}">Catálogo (${S.produtos.length})</button>
  </div>`;

  if(S.custoView === 'produtos') {
    return `<div class="pad">${tabToggle}${renderCatalogo()}</div>`;
  }

  return `<div class="pad">
    ${tabToggle}
    <div class="card">
      <div style="font-size:14px;font-weight:500;color:var(--text);margin-bottom:14px">Registrar Custo</div>

      <!-- Data — sempre visível -->
      <div style="margin-bottom:8px">
        <label class="lbl">Data</label>
        <input type="date" id="cus-data" value="${today()}">
      </div>

      <!-- Busca produto — visível quando há produtos cadastrados -->
      ${S.produtos.length > 0 ? `
      <div style="margin-bottom:8px;position:relative">
        <label class="lbl">Produto do Catálogo</label>
        <div style="position:relative">
          <input type="text" id="cus-prod-search" placeholder="buscar produto..." autocomplete="off" style="padding-right:32px">
          <button id="cus-prod-clear" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0;line-height:1">✕</button>
        </div>
        <input type="hidden" id="cus-prod" value="">
        <div id="cus-prod-results" style="display:none;position:absolute;left:0;right:0;z-index:150;background:#0d1a0d;border:1px solid var(--border);border-radius:8px;max-height:200px;overflow-y:auto;margin-top:2px"></div>
      </div>` : ''}

      <!-- Campos produto (oculto por padrão, aparece ao selecionar produto) -->
      <div id="cus-prod-fields" style="display:none">
        <div class="prod-info-box">
          <div style="font-size:9px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.08em">Produto selecionado</div>
          <div id="cus-prod-meta" style="font-size:11px;color:var(--greenD)"></div>
        </div>
        <div class="grid2" style="margin-bottom:8px">
          <div><label class="lbl" id="cus-qtd-lbl">Qtd</label><input type="number" id="cus-qtd" placeholder="0" min="0" step="0.01"></div>
          <div><label class="lbl">R$/Un.</label><input type="number" id="cus-precounit" placeholder="0,00" min="0" step="0.01"></div>
        </div>
        <div class="total-box">
          <span style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Total</span>
          <span style="font-size:16px;font-weight:500;color:var(--green)" id="cus-total-val">R$ 0,00</span>
        </div>
      </div>

      <!-- Campos avulso (visíveis por padrão) -->
      <div id="cus-avulso-fields">
        <div class="grid2" style="margin-bottom:8px">
          <div><label class="lbl">Categoria</label><select id="cus-cat">${CAT_INSUMOS.map(c=>`<option>${c}</option>`).join('')}</select></div>
          <div><label class="lbl">Subcategoria</label><select id="cus-subcat">${CAT_CUSTOS[CAT_INSUMOS[0]].map(s=>`<option>${s}</option>`).join('')}</select></div>
        </div>
        <div style="margin-bottom:8px"><label class="lbl">Descrição</label><input type="text" id="cus-desc" placeholder="ex: Verango Prime Bayer 1L" required></div>
        <div style="margin-bottom:8px"><label class="lbl">Valor (R$)</label><input type="number" min="0" step="0.01" id="cus-val" placeholder="0,00"></div>
      </div>

      <!-- Repetir — sempre visível -->
      <div style="margin-bottom:8px"><label class="lbl">Repetir</label><select id="cus-repetir"><option value="nao">Não repete</option><option value="quinzenal">Quinzenal</option><option value="mensal">Mensal</option><option value="parcelado">Parcelado</option></select></div>
      <div id="cus-parcelas-box" style="display:none;margin-bottom:8px"><label class="lbl">Nº de Parcelas</label><input type="number" min="2" max="60" id="cus-parcelas" placeholder="ex: 6"></div>
      <button class="btn btn-red" id="btn-salvar-cus">Registrar Custo</button>
    </div>

    ${porCat.length>0?`<div class="card">
      <div class="card-title">Por Categoria — Mês Atual</div>
      <div style="font-size:11px;color:var(--orange);margin-bottom:10px">Total: ${fmt$(totalMes)}</div>
      ${porCat.map(x=>{
        const pct=totalMes>0?x.total/totalMes*100:0;
        return `<div style="margin-bottom:10px">
          <div class="row" style="margin-bottom:3px">
            <div style="font-size:12px;color:var(--greenD)">${x.cat}</div>
            <div class="row" style="gap:8px">
              <div style="font-size:10px;color:var(--muted)">${pct.toFixed(0)}%</div>
              <div style="font-size:12px;color:var(--orange);font-weight:500">${fmt$(x.total)}</div>
            </div>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:var(--orange)"></div></div>
          ${x.subs.length>0?`<div style="margin-top:4px">${x.subs.map(s=>`
            <div class="row" style="padding:2px 0;font-size:10px">
              <div style="color:var(--muted);padding-left:8px">↳ ${s.sub}</div>
              <div style="color:var(--orange)">${fmt$(s.total)}</div>
            </div>`).join('')}</div>`:''}
        </div>`;
      }).join('')}
    </div>`:''}

    ${aVencer.length>0?`<div class="card" style="border-color:#92400e">
      <div class="card-title" style="color:var(--amber)">A Vencer</div>
      ${visivelVencer.map(c=>`
        <div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;min-width:0;margin-right:8px">
            <div style="font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${nomeCusto(c)}</div>
            <div style="font-size:10px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap"><span>${fmtD(c.data)}</span><span>·</span><span>${c.categoria}${c.subcategoria?" › "+c.subcategoria:""}</span>${c.repetir&&c.repetir!=="nao"?`<span style="color:var(--amber)">${c.repetir==="mensal"?"↻ Mensal":c.repetir==="quinzenal"?"↻ Quinzenal":"Parcela "+c.parcelaNum+"/"+c.parcelasTotal}</span>`:""}</div>
            ${detalheCusto(c)?`<div style="font-size:10px;color:var(--muted);margin-top:1px">${detalheCusto(c)}</div>`:''}
          </div>
          <div class="row" style="gap:8px;flex-shrink:0">
            <div style="font-size:13px;color:var(--amber);font-weight:500">${fmt$(c.valor)}</div>
            <button class="btn-danger" style="background:#0a2a0a;color:var(--blue)" data-edit-cus="${c.id}">✎</button>
            <button class="btn-danger" data-del-cus="${c.id}">✕</button>
          </div>
        </div>`).join('')}
      ${btnVerMais(S.verMais.vencer, aVencer.length, 'vencer')}
    </div>`:''}

    <div class="card">
      <div class="card-title">Histórico</div>
      ${passados.length===0?'<div class="empty">Nenhum custo registrado ainda.</div>':`
        ${visivelCustos.map(c=>`
          <div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)">
            <div style="flex:1;min-width:0;margin-right:8px">
              <div style="font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${nomeCusto(c)}${c.repetir==='mensal'?' ↻':c.repetir==='quinzenal'?' ↻':c.repetir==='parcelado'?' ('+c.parcelaNum+'/'+c.parcelasTotal+')':''}</div>
              <div style="font-size:10px;color:var(--muted)">${fmtD(c.data)} · ${c.categoria}${c.subcategoria?" › "+c.subcategoria:""}</div>
              ${detalheCusto(c)?`<div style="font-size:10px;color:var(--muted)">${detalheCusto(c)}</div>`:''}
            </div>
            <div class="row" style="gap:8px;flex-shrink:0">
              <div style="font-size:13px;color:var(--orange);font-weight:500">${fmt$(c.valor)}</div>
              <button class="btn-danger" style="background:#0a2a0a;color:var(--blue)" data-edit-cus="${c.id}">✎</button>
              <button class="btn-danger" data-del-cus="${c.id}">✕</button>
            </div>
          </div>`).join('')}
        ${btnVerMais(S.verMais.custos, passados.length, 'custos')}
      `}
    </div>
  </div>`;
}

// ─── CATÁLOGO DE PRODUTOS ─────────────────────────────────────────────────────
function renderCatalogo() {
  const porCat = CAT_INSUMOS
    .map(cat=>({ cat, prods: S.produtos.filter(p=>p.categoria===cat).sort((a,b)=>a.nome.localeCompare(b.nome)) }))
    .filter(x=>x.prods.length>0);

  return `
    <div class="row" style="margin-bottom:4px">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">${S.produtos.length} produto${S.produtos.length!==1?'s':''} cadastrado${S.produtos.length!==1?'s':''}</div>
      <button data-novo-produto class="btn btn-green btn-sm">+ Produto</button>
    </div>

    ${S.produtos.length===0?`<div class="card"><div class="empty">Nenhum produto cadastrado.<br>Adicione produtos para agilizar<br>o lançamento de custos.</div></div>`:''}

    ${porCat.map(({cat, prods})=>`
      <div class="card" style="padding:10px 14px">
        <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)">${cat}</div>
        ${prods.map(p=>`
          <div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)">
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.nome}${p.isCalcinit?` <span style="font-size:8px;color:var(--green);border:1px solid #16a34a55;padding:1px 4px;border-radius:3px">T/Qu</span>`:''}</div>
              <div style="font-size:10px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap">
                <span>${p.subcategoria}</span>
                <span>· ${p.unidade||'—'}</span>
                ${p.marca?`<span style="color:var(--greenD)">· ${p.marca}</span>`:''}
                ${p.principioAtivo?`<span>· ${p.principioAtivo}${p.concentracao?' '+p.concentracao:''}</span>`:''}
              </div>
              ${cat==='Fertilizantes'&&((p.garantiaN||0)+(p.garantiaP||0)+(p.garantiaK||0)+(p.garantiaCa||0)+(p.garantiaMg||0)+(p.garantiaS||0)>0)?`<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">
                ${[['N',p.garantiaN,'#60a5fa'],['P',p.garantiaP,'#fbbf24'],['K',p.garantiaK,'#4ade80'],['Ca',p.garantiaCa,'#fb923c'],['Mg',p.garantiaMg,'#86efac'],['S',p.garantiaS,'#9ca3af'],['B',p.garantiaB,'#c084fc'],['Zn',p.garantiaZn,'#fdba74']].filter(([,v])=>v>0).map(([k,v,c])=>`<span style="font-size:8px;padding:1px 5px;background:#080e08;border:1px solid var(--border);border-radius:3px"><span style="color:${c}">${k}</span> <span style="color:var(--text)">${v}%</span></span>`).join('')}
                ${(+p.precoEmbalagem>0&&+p.pesoEmbalagem>0)?`<span style="font-size:8px;padding:1px 5px;background:#080e08;border:1px solid var(--border);border-radius:3px;color:var(--green)">R$${(p.precoEmbalagem/p.pesoEmbalagem).toFixed(2)}/kg</span>`:''}
              </div>`:''}
            </div>
            <div class="row" style="gap:6px;flex-shrink:0">
              <button class="btn-danger" style="background:#0a2a0a;color:var(--blue)" data-edit-prod="${p.id}">✎</button>
              <button class="btn-danger" data-del-prod="${p.id}">✕</button>
            </div>
          </div>`).join('')}
      </div>`).join('')}
  `;
}

// ─── ESTUFAS ─────────────────────────────────────────────────────────────────
function renderEstufas() {
  return `<div class="pad">
    <div class="card-title">Gerenciar Ciclos</div>
    ${Array.from({length:N_ESTUFAS},(_,i)=>{
      const e = i+1;
      const ci = cicloAtivo(e);

function renderLinhaPreco(pts, color) {
  if(pts.length<2) return `<div style="font-size:10px;color:var(--muted)">Dados insuficientes</div>`;
  const max=Math.max(...pts.map(p=>p.v));
  const min=Math.min(...pts.map(p=>p.v));
  const range=max-min||1;
  const w=320,h=55,pad=14;
  const x=i=>(i/(pts.length-1))*(w-2*pad)+pad;
  const y=v=>h-pad-((v-min)/range)*(h-2*pad);
  const path=pts.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  return `<div style="overflow-x:auto">
    <svg width="${w}" height="${h}" style="display:block">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
      ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="${color}"/>
        <text x="${x(i).toFixed(1)}" y="${h}" text-anchor="middle" fill="#4b5563" font-size="8" font-family="DM Mono">${p.d}</text>
        <text x="${x(i).toFixed(1)}" y="${(y(p.v)-6).toFixed(1)}" text-anchor="middle" fill="${color}" font-size="8" font-family="DM Mono">${fmt$(p.v).replace('R$\u00a0','')}</text>`).join('')}
    </svg>
  </div>`;
}

function calcAlocacao() {
  const colheitas = S.colheitas;
  if(colheitas.length===0) return [];
  const estufaCaixas = {};
  colheitas.forEach(col=>{
    const dia = col.data;
    const estufasAtivas = S.ciclos.filter(ci=>{
      if(!ci.primeiraColheita) return false;
      const inicio = ci.primeiraColheita;
      const fim = ci.ultimaColheita || (!ci.encerrado ? today() : null);
      if(!fim) return false;
      return dia >= inicio && dia <= fim;
    });
    if(estufasAtivas.length===0) return;
    const cxPorEstufa = cxTotal(col) / estufasAtivas.length;
    estufasAtivas.forEach(ci=>{
      estufaCaixas[ci.estufa] = (estufaCaixas[ci.estufa]||0) + cxPorEstufa;
    });
  });
  const totalCx = Object.values(estufaCaixas).reduce((a,v)=>a+v,0);
  if(!totalCx) return [];
  return Object.entries(estufaCaixas)
    .map(([e,cx])=>({estufa:+e, caixas:cx, pct:cx/totalCx*100}))
    .sort((a,b)=>b.caixas-a.caixas);
}

function calcFertigPrograma(ciclo, curvaKey) {
  const curva  = CURVAS_EXTRACAO[curvaKey || S.fertCurva] || CURVAS_EXTRACAO['marco-alvarenga'];
  const plantas = +ciclo.qtdMudas || 0;
  const metaKg  = +ciclo.metaKgPe || 10;
  const prodTon = plantas * metaKg / 1000;

  const eficN  = (+ciclo.eficN  || 80) / 100;
  const eficP  = (+ciclo.eficP  || 40) / 100;
  const eficK  = (+ciclo.eficK  || 80) / 100;
  const eficCa = (+ciclo.eficCa || 50) / 100;
  const eficMg = (+ciclo.eficMg || 60) / 100;
  const pctCa  = (+ciclo.pctCaFertig || 25) / 100;

  const totN   = prodTon * curva.N  / eficN;
  const totP   = prodTon * curva.P  / eficP * P2O5_FATOR;
  const totK   = prodTon * curva.K  / eficK * K2O_FATOR;
  const totCa  = prodTon * curva.Ca / eficCa * pctCa;
  const totMg  = prodTon * curva.Mg / eficMg;
  const totS   = prodTon * curva.S;
  const totB   = prodTon > 0 ? prodTon * curva.B_gton  / EFIC_MICRO : 0; // g
  const totZn  = prodTon > 0 ? prodTon * curva.Zn_gton / EFIC_MICRO : 0; // g

  const semanasAtivas = DIST_FERTIG.filter(d=>d.some(x=>x>0)).length;

  const semanas = DIST_FERTIG.map((d, i) => {
    const semana = i + 1;
    const ativo  = d.some(x=>x>0);
    const fase   = semana<=5?1:semana<=11?2:3;
    return {
      semana, dat: i*7+1, fase, ativo,
      N: totN*d[0], P2O5: totP*d[1], K2O: totK*d[2],
      Ca: totCa*d[3], Mg: totMg*d[4], S: totS*d[5],
      B_g:  ativo ? totB  / semanasAtivas : 0,
      Zn_g: ativo ? totZn / semanasAtivas : 0,
    };
  });

  return {
    totais: {N:totN,P2O5:totP,K2O:totK,Ca:totCa,Mg:totMg,S:totS,B_g:totB,Zn_g:totZn},
    semanas, prodTon, plantas,
  };
}

// Greedy allocation: sequential nutrient coverage
function alocarSemana(targets, produtos) {
  const ferts = produtos.filter(p =>
    p.categoria === 'Fertilizantes' &&
    ((p.garantiaN||0)+(p.garantiaP||0)+(p.garantiaK||0)+(p.garantiaCa||0)+(p.garantiaMg||0)+(p.garantiaS||0)>0)
  );
  if (!targets.ativo || ferts.length === 0) return [];

  const rem = {N:targets.N, P2O5:targets.P2O5, K2O:targets.K2O, Ca:targets.Ca, Mg:targets.Mg, S:targets.S};
  const usado = {};

  function addKg(prod, kg) {
    if (kg <= 0 || !isFinite(kg)) return;
    usado[prod.id] = (usado[prod.id]||0) + kg;
    rem.N    = Math.max(0, rem.N    - kg*(prod.garantiaN ||0)/100);
    rem.P2O5 = Math.max(0, rem.P2O5 - kg*(prod.garantiaP ||0)/100);
    rem.K2O  = Math.max(0, rem.K2O  - kg*(prod.garantiaK ||0)/100);
    rem.Ca   = Math.max(0, rem.Ca   - kg*(prod.garantiaCa||0)/100);
    rem.Mg   = Math.max(0, rem.Mg   - kg*(prod.garantiaMg||0)/100);
    rem.S    = Math.max(0, rem.S    - kg*(prod.garantiaS ||0)/100);
  }

  // 1. Calcinit (terça/quinta) → cobre Ca
  ferts.filter(p=>p.isCalcinit&&(p.garantiaCa||0)>0).slice(0,1)
    .forEach(p => rem.Ca>0.001 && addKg(p, rem.Ca/(p.garantiaCa/100)));

  // 2. Fonte de P₂O₅
  ferts.filter(p=>!p.isCalcinit&&(p.garantiaP||0)>0&&!usado[p.id])
    .sort((a,b)=>b.garantiaP-a.garantiaP).slice(0,1)
    .forEach(p => rem.P2O5>0.001 && addKg(p, rem.P2O5/(p.garantiaP/100)));

  // 3. Fonte de K₂O
  ferts.filter(p=>!p.isCalcinit&&(p.garantiaK||0)>0&&!usado[p.id])
    .sort((a,b)=>b.garantiaK-a.garantiaK).slice(0,1)
    .forEach(p => rem.K2O>0.001 && addKg(p, rem.K2O/(p.garantiaK/100)));

  // 4. Fonte de Mg
  ferts.filter(p=>!p.isCalcinit&&(p.garantiaMg||0)>0&&!usado[p.id])
    .sort((a,b)=>b.garantiaMg-a.garantiaMg).slice(0,1)
    .forEach(p => rem.Mg>0.001 && addKg(p, rem.Mg/(p.garantiaMg/100)));

  // 5. Fonte de S residual
  ferts.filter(p=>!p.isCalcinit&&(p.garantiaS||0)>0&&!usado[p.id])
    .sort((a,b)=>b.garantiaS-a.garantiaS).slice(0,1)
    .forEach(p => rem.S>0.001 && addKg(p, rem.S/(p.garantiaS/100)));

  // 6. Fonte de N residual
  ferts.filter(p=>!p.isCalcinit&&(p.garantiaN||0)>0&&!usado[p.id])
    .sort((a,b)=>b.garantiaN-a.garantiaN).slice(0,1)
    .forEach(p => rem.N>0.001 && addKg(p, rem.N/(p.garantiaN/100)));

  return Object.entries(usado).map(([id, kg]) => {
    const prod = ferts.find(p=>p.id===id);
    return {id, nome: prod.nome, kg: +kg.toFixed(3), isCalcinit: !!prod.isCalcinit};
  });
}

function addDaysStr(dateStr, days) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y,m-1,d));
  dt.setUTCDate(dt.getUTCDate()+days);
  return dt.toISOString().slice(0,10);
}
function dowOf(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,d)).getUTCDay(); // 0=Sun
}

// ─── FERTIRRIGAÇÃO VIEWS ──────────────────────────────────────────────────────
function renderFertig() {
  // Auto-select first estufa with active cycle
  const estufasComCiclo = Array.from({length:N_ESTUFAS},(_,i)=>i+1).filter(e=>cicloAtivo(e));
  if(S.fertEstufa===null && estufasComCiclo.length>0) S.fertEstufa = estufasComCiclo[0];

  const estufaSelector = `<div class="card" style="padding:10px 14px">
    <label class="lbl">Estufa</label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:2px">
      ${Array.from({length:N_ESTUFAS},(_,i)=>{
        const e=i+1; const ci=cicloAtivo(e);
        const dias=ci?diasDesde(ci.plantio):null;
        const ativo=S.fertEstufa===e;
        return `<button data-fertig-estufa="${e}" style="padding:6px 12px;border-radius:8px;border:1px solid ${ativo?'var(--green)':ci?'var(--border)':'#0f1f0f'};background:${ativo?'#16a34a22':'transparent'};color:${ativo?'var(--green)':ci?'var(--text)':'var(--muted)'};font-family:'DM Mono',monospace;font-size:11px;cursor:pointer">
          E${e}${dias!==null?` · ${dias}d`:''}

      }).join('')}

  if(!S.fertEstufa) return `<div class="pad">${estufaSelector}
    <div class="card"><div class="empty">Nenhuma estufa com ciclo ativo.</div></div></div>`;

  const ci = cicloAtivo(S.fertEstufa);
  if(!ci) return `<div class="pad">${estufaSelector}
    <div class="card"><div class="empty">Sem ciclo ativo nesta estufa.</div></div></div>`;

  if(!ci.qtdMudas || !ci.metaKgPe) {
    return `<div class="pad">${estufaSelector}
      <div class="card" style="border-color:var(--amber)">

      </div></div>`;
  }

  const prog = calcFertigPrograma(ci, S.fertCurva);

  const curvaAtual = CURVAS_EXTRACAO[S.fertCurva] || CURVAS_EXTRACAO['marco-alvarenga'];
  const curvaSelector = `<div class="card" style="padding:10px 14px">
    <label class="lbl">Curva de Extração</label>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">
      ${Object.entries(CURVAS_EXTRACAO).map(([k,c])=>{
        const ativo = S.fertCurva===k;
        return `<button data-fertig-curva="${k}" style="padding:5px 10px;border-radius:8px;border:1px solid ${ativo?'var(--green)':'var(--border)'};background:${ativo?'#16a34a22':'transparent'};color:${ativo?'var(--green)':'var(--muted)'};font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;white-space:nowrap">${c.label}</button>`;
      }).join('')}
    </div>
    <div style="margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;font-size:9px;color:var(--muted)">
      ${[['N',curvaAtual.N],['P',curvaAtual.P],['K',curvaAtual.K],['Ca',curvaAtual.Ca],['Mg',curvaAtual.Mg],['S',curvaAtual.S]].map(([k,v])=>`<span><span style="color:var(--text)">${k}</span> ${v} kg/t</span>`).join('')}
    </div>
  </div>`;

  const summaryCard = `<div class="card" style="padding:10px 14px">
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em">Estufa ${S.fertEstufa} · ${ci.variedade||'—'}</div>
    <div class="grid2" style="font-size:11px;gap:6px">
      <div><span style="color:var(--muted)">Plantas:</span> <span style="color:var(--text)">${prog.plantas.toLocaleString('pt-BR')}</span></div>
      <div><span style="color:var(--muted)">Meta:</span> <span style="color:var(--text)">${ci.metaKgPe} kg/pé</span></div>
      <div><span style="color:var(--muted)">Produção est.:</span> <span style="color:var(--green);font-weight:500">${prog.prodTon.toFixed(2)} t</span></div>
      <div><span style="color:var(--muted)">Plantio:</span> <span style="color:var(--text)">${fmtD(ci.plantio)}</span></div>

    <button data-fertig-tab="programa"  class="pill-btn${S.fertTab==='programa' ?' active':''}">Totais</button>
    <button data-fertig-tab="semanas"   class="pill-btn${S.fertTab==='semanas'  ?' active':''}">Semanas</button>

}

function renderFertigTotais(prog, ci) {
  const t = prog.totais;

  // Estimate cost across all active weeks
  const fertsComPreco = S.produtos.filter(p=>p.categoria==='Fertilizantes'&&(+p.precoEmbalagem||0)>0&&(+p.pesoEmbalagem||0)>0);
  let custoTotal = 0;
  if(fertsComPreco.length>0) {
    prog.semanas.filter(s=>s.ativo).forEach(sem=>{
      alocarSemana(sem, S.produtos).forEach(item=>{
        const prod = fertsComPreco.find(p=>p.id===item.id);
        if(prod) custoTotal += item.kg * (prod.precoEmbalagem/prod.pesoEmbalagem);
      });
    });
  }

  const fases = [1,2,3].map(f=>{
    const sems = prog.semanas.filter(s=>s.fase===f&&s.ativo);
    const tot = k => sems.reduce((a,s)=>a+s[k],0);
    return {f, label:f===1?'Fase 1 · 0–36 DAT':f===2?'Fase 2 · 36–78 DAT':'Fase 3 · 79–166 DAT',
      N:tot('N'),P2O5:tot('P2O5'),K2O:tot('K2O'),Ca:tot('Ca'),Mg:tot('Mg'),S:tot('S')};
  });

  const eficStr = `N=${ci.eficN||80}% · P=${ci.eficP||40}% · K=${ci.eficK||80}% · Ca efic=${ci.eficCa||50}% · Ca fertig=${ci.pctCaFertig||25}% · Mg=${ci.eficMg||60}%`;

  return `
    <div class="card">
      <div class="card-title">Totais do Ciclo (kg)</div>
      <div style="font-size:9px;color:var(--muted);margin-bottom:8px;line-height:1.6">${eficStr}</div>
      <div class="grid3" style="gap:6px">
        ${[['N',t.N],['P₂O₅',t.P2O5],['K₂O',t.K2O],['Ca',t.Ca],['Mg',t.Mg],['S',t.S]].map(([l,v])=>
          `<div class="metric"><div class="metric-label">${l}</div><div class="metric-val" style="font-size:16px">${v.toFixed(2)}</div><div class="metric-sub">kg</div></div>`
        ).join('')}
      </div>
      ${t.B_g>0?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;gap:20px;font-size:11px">
        <div><span style="color:var(--muted)">Boro total:</span> <span style="color:var(--text)">${t.B_g.toFixed(1)} g</span></div>
        <div><span style="color:var(--muted)">Zinco total:</span> <span style="color:var(--text)">${t.Zn_g.toFixed(1)} g</span></div>
      </div>`:''}
    </div>

    ${fases.map(f=>`<div class="card">
      <div class="card-title">${f.label}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:10px">
        ${[['N',f.N],['P₂O₅',f.P2O5],['K₂O',f.K2O],['Ca',f.Ca],['Mg',f.Mg],['S',f.S]].map(([l,v])=>
          `<div style="padding:5px;background:#080e08;border:1px solid var(--border);border-radius:6px">
            <div style="color:var(--muted);font-size:8px;text-transform:uppercase">${l}</div>
            <div style="color:var(--text);font-weight:500">${v.toFixed(2)} kg</div>
          </div>`
        ).join('')}
      </div>
    </div>`).join('')}

    ${custoTotal>0?`<div class="card" style="border-color:#166534">
      <div class="card-title">Custo Estimado — Insumos Fertirrigação</div>
      <div style="font-size:22px;font-weight:500;color:var(--green)">${fmt$(custoTotal)}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:4px">Baseado nos produtos cadastrados com preço/embalagem. Não incluso nos lançamentos de custo.</div>
    </div>`:`<div class="card">
      <div class="card-title">Custo de Adubação</div>
      <div style="font-size:11px;color:var(--muted);line-height:1.7">Cadastre fertilizantes com preço e peso de embalagem para calcular o custo estimado do ciclo.</div>
    </div>`}
  `;
}

function renderFertigSemanas(prog) {
  const hasFerts = S.produtos.some(p=>p.categoria==='Fertilizantes'&&((p.garantiaN||0)+(p.garantiaP||0)+(p.garantiaK||0)+(p.garantiaCa||0)+(p.garantiaMg||0)+(p.garantiaS||0)>0));

  return prog.semanas.filter(s=>s.ativo).map(sem=>{
    const alocado = alocarSemana(sem, S.produtos);
    const calcs = alocado.filter(a=>a.isCalcinit);
    const outros = alocado.filter(a=>!a.isCalcinit);

    return `<div class="card" style="padding:10px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:12px;font-weight:500;color:var(--text)">Semana ${sem.semana}</div>
        <div style="font-size:10px;color:var(--muted)">DAT ${sem.dat} · Fase ${sem.fase}</div>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
        ${[['N',sem.N,'#60a5fa'],['P₂O₅',sem.P2O5,'#fbbf24'],['K₂O',sem.K2O,'#4ade80'],['Ca',sem.Ca,'#fb923c'],['Mg',sem.Mg,'#86efac'],['S',sem.S,'#9ca3af']].map(([k,v,c])=>
          v>0.001?`<span style="font-size:9px;padding:2px 6px;background:#080e08;border:1px solid var(--border);border-radius:4px"><span style="color:${c}">${k}</span> <span style="color:var(--text)">${v.toFixed(2)}</span></span>`:''
        ).join('')}
      </div>
      ${alocado.length>0?`
        ${calcs.length>0?`<div style="padding:6px 8px;margin-bottom:5px;background:#16a34a0d;border:1px solid #16a34a33;border-radius:6px">
          <div style="font-size:8px;color:var(--green);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">Terça e Quinta — Calcinit</div>
          ${calcs.map(a=>`<div style="font-size:11px;color:var(--text)">${a.nome}: <span style="color:var(--green);font-weight:500">${a.kg.toFixed(3)} kg/sem</span> <span style="color:var(--muted)">(${(a.kg/2).toFixed(3)} kg/dia)</span></div>`).join('')}
        </div>`:''}
        ${outros.length>0?`<div style="padding:6px 8px;background:#1e40af0d;border:1px solid #1e40af33;border-radius:6px">
          <div style="font-size:8px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">Seg, Qua e Sex</div>
          ${outros.map(a=>`<div style="font-size:11px;color:var(--text)">${a.nome}: <span style="color:var(--blue);font-weight:500">${a.kg.toFixed(3)} kg/sem</span> <span style="color:var(--muted)">(${(a.kg/3).toFixed(3)} kg/dia)</span></div>`).join('')}
        </div>`:''}
      `:`<div style="font-size:10px;color:var(--muted);font-style:italic">${hasFerts?'Sem produtos alocados para esta semana.':'Cadastre fertilizantes com garantias nutricionais.'}</div>`}
    </div>`;
  }).join('');
}

function renderFertigCalendario(prog, ci) {
  const semAtiva = S.fertSemana;
  // Find nearest active semana
  let sem = prog.semanas[semAtiva-1];
  if(!sem || !sem.ativo) {
    const next = prog.semanas.find(s=>s.semana>=semAtiva&&s.ativo);
    if(next){ S.fertSemana = next.semana; sem = next; } else return `<div class="card"><div class="empty">Nenhuma semana ativa.</div></div>`;
  }

  const alocado  = alocarSemana(sem, S.produtos);
  const calcs    = alocado.filter(a=>a.isCalcinit);
  const outros   = alocado.filter(a=>!a.isCalcinit);
  const kgCalcDia  = calcs.reduce((s,a)=>s+a.kg,0) / 2;
  const kgOutrosDia= outros.reduce((s,a)=>s+a.kg,0) / 3;

  const prevSem = [...prog.semanas].reverse().find(s=>s.semana<sem.semana&&s.ativo);
  const nextSem = prog.semanas.find(s=>s.semana>sem.semana&&s.ativo);

  // Build Mon-Fri dates for this week (week 1 = DAT 1)
  const weekStartDate = addDaysStr(ci.plantio, (sem.semana-1)*7);
  const DOW_PT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const weekDays = [];
  for(let d=0;d<7;d++){
    const dt = addDaysStr(weekStartDate, d);
    const dow = dowOf(dt);
    if(dow===0||dow===6) continue;
    weekDays.push({dt, dow, label: DOW_PT[dow],
      isCalc: dow===2||dow===4,   // Ter=2, Qui=4
      isOther: dow===1||dow===3||dow===5, // Seg=1, Qua=3, Sex=5
    });
  }

  return `
    <div class="card" style="padding:10px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <button data-fertig-sem="${prevSem?prevSem.semana:sem.semana}" class="btn btn-ghost btn-sm" ${!prevSem?'disabled style="opacity:.3"':''}>◀</button>
        <div style="text-align:center">
          <div style="font-size:13px;font-weight:500;color:var(--text)">Semana ${sem.semana} — Fase ${sem.fase}</div>
          <div style="font-size:10px;color:var(--muted)">DAT ${sem.dat} · início ${fmtD(weekStartDate)}</div>
        </div>
        <button data-fertig-sem="${nextSem?nextSem.semana:sem.semana}" class="btn btn-ghost btn-sm" ${!nextSem?'disabled style="opacity:.3"':''}>▶</button>
      </div>

      <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px">Metas semanais (kg)</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">
        ${[['N',sem.N,'#60a5fa'],['P₂O₅',sem.P2O5,'#fbbf24'],['K₂O',sem.K2O,'#4ade80'],['Ca',sem.Ca,'#fb923c'],['Mg',sem.Mg,'#86efac'],['S',sem.S,'#9ca3af']].map(([k,v,c])=>
          v>0.001?`<span style="font-size:9px;padding:3px 7px;background:#080e08;border:1px solid var(--border);border-radius:4px"><span style="color:${c}">${k}</span> <span style="color:var(--text);font-weight:500">${v.toFixed(2)}</span></span>`:''
        ).join('')}
      </div>

      ${weekDays.map(day=>{
        const prods   = day.isCalc ? calcs : day.isOther ? outros : [];
        const kgDia   = day.isCalc ? kgCalcDia : day.isOther ? kgOutrosDia : 0;
        const bColor  = day.isCalc ? '#16a34a33' : day.isOther ? '#1e40af33' : 'var(--border)';
        const tColor  = day.isCalc ? 'var(--green)' : day.isOther ? 'var(--blue)' : 'var(--muted)';
        const label   = day.isCalc ? 'Calcinit' : day.isOther ? 'Fertirrig.' : '';
        return `<div style="padding:8px 10px;background:#080e08;border:1px solid ${bColor};border-radius:8px;margin-bottom:5px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${prods.length>0?4:0}px">
            <div style="font-size:12px;font-weight:500;color:${tColor}">${day.label} <span style="font-size:10px;color:var(--muted)">${fmtD(day.dt).slice(0,5)}</span>${label?` <span style="font-size:8px;padding:1px 5px;border-radius:3px;border:1px solid ${bColor};color:${tColor}">${label}</span>`:''}</div>
            ${kgDia>0.001?`<div style="font-size:11px;color:${tColor};font-weight:500">${kgDia.toFixed(3)} kg</div>`:''}
          </div>
          ${prods.length>0?prods.map(p=>`<div style="font-size:10px;color:var(--text);padding-left:8px">· ${p.nome}: <span style="color:${tColor}">${(day.isCalc?p.kg/2:p.kg/3).toFixed(3)} kg</span></div>`).join(''):'<div style="font-size:10px;color:var(--muted);padding-left:4px">—</div>'}
        </div>`;
      }).join('')}
    </div>
  `;
}

// ─── MODAIS ──────────────────────────────────────────────────────────────────
function labelPrincipio(cat) {
  if(cat==='Defensivos'||cat==='Biológicos Solo') return 'Princípio Ativo';
  if(cat==='Mudas')         return 'Variedade';
  if(cat==='Fertilizantes') return 'Formulação';
  return 'Especificação';
}

        <div><label class="lbl">Tipo</label><select id="m-occ-tipo">${TIPOS_OCC.map(t=>`<option>${t}</option>`).join('')}</select></div>
      </div>
      <div style="margin-bottom:8px"><label class="lbl">Descrição</label><input type="text" id="m-occ-desc" placeholder="ex: Míldio, Ácaro rajado, Defic. Magnésio"></div>
      <div style="margin-bottom:8px"><label class="lbl">Severidade</label>
        <div style="display:flex;gap:8px;margin-top:4px">
          ${SEV.map(s=>`<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
            <input type="radio" name="m-occ-sev" value="${s}" ${s==='leve'?'checked':''}> ${s}
          </label>`).join('')}
        </div>
      </div>
      <div class="grid2" style="margin-bottom:8px">
        <div><label class="lbl">Produto Aplicado</label><input type="text" id="m-occ-prod" placeholder="opcional"></div>
        <div><label class="lbl">Dose</label><input type="text" id="m-occ-dose" placeholder="ex: 2mL/L"></div>
      </div>

      <button class="btn btn-blue" id="btn-salvar-occ">Registrar Ocorrência</button>`;
  }

  return `<div class="overlay" id="modal-overlay">
    <div class="modal">${body}</div>
  </div>`;
}

function updateSubcat() {
  const cat = document.getElementById('cus-cat')?.value;
  const sub = document.getElementById('cus-subcat');
  if(!cat||!sub) return;
  sub.innerHTML = (CAT_CUSTOS[cat]||[]).map(s=>`<option>${s}</option>`).join('');
}

function updateProdSubcat() {
  const cat = document.getElementById('m-prod-cat')?.value;
  const sub = document.getElementById('m-prod-subcat');
  if(!cat||!sub) return;
  const cur = sub.value;
  sub.innerHTML = (CAT_CUSTOS[cat]||[]).map(s=>`<option${s===cur?' selected':''}>${s}</option>`).join('');
  const lbl = document.getElementById('m-prod-pa-lbl');
  if(lbl) lbl.textContent = labelPrincipio(cat);
  const paRow = document.getElementById('m-prod-pa')?.closest('.grid2');
  if(paRow) paRow.style.display = cat==='Mudas' ? 'none' : '';
  const fertigBox = document.getElementById('m-prod-fertig-box');
  if(fertigBox) fertigBox.style.display = cat==='Fertilizantes' ? 'block' : 'none';
}

function updatePrecoKg() {
  const preco = +document.getElementById('m-prod-preco-emb')?.value||0;
  const peso  = +document.getElementById('m-prod-peso-emb')?.value||0;
  const box   = document.getElementById('m-prod-preco-kg-box');
  if(box) box.textContent = (preco>0&&peso>0) ? `R$ ${(preco/peso).toFixed(2)} / kg` : '';
}

function onProdSearch() {
  const q = document.getElementById('cus-prod-search')?.value?.toLowerCase().trim();
  const res = document.getElementById('cus-prod-results');
  if(!res) return;
  if(!q) { res.style.display='none'; return; }
  const matches = S.produtos
    .filter(p => p.nome.toLowerCase().includes(q))
    .sort((a,b) => a.nome.localeCompare(b.nome))
    .slice(0, 10);
  if(matches.length === 0) {
    res.innerHTML = `<div style="padding:10px 12px;font-size:12px;color:var(--muted)">Nenhum produto encontrado</div>`;
  } else {
    res.innerHTML = matches.map(p => `
      <div data-sel-prod="${p.id}" data-sel-cat="${p.categoria}" data-sel-sub="${p.subcategoria}" data-sel-un="${p.unidade||'un.'}" data-sel-nome="${p.nome.replace(/"/g,'&quot;')}"
        style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border)">
        <div style="font-size:12px;color:var(--text)">${p.nome}${p.marca?` <span style="color:var(--muted)">· ${p.marca}</span>`:''}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:1px">${p.subcategoria} · ${p.unidade||'un.'}</div>
      </div>`).join('');
    res.querySelectorAll('[data-sel-prod]').forEach(item => {
      item.addEventListener('click', () => selecionarProduto(item.dataset));
    });
  }
  res.style.display = 'block';
}

function selecionarProduto(d) {
  const hidden = document.getElementById('cus-prod');
  const search = document.getElementById('cus-prod-search');
  const res    = document.getElementById('cus-prod-results');
  const clr    = document.getElementById('cus-prod-clear');
  if(hidden) hidden.value = d.selProd;
  if(search) { search.value = d.selNome; search.readOnly = true; }
  if(res)  res.style.display = 'none';
  if(clr)  clr.style.display = 'block';
  const prodFields   = document.getElementById('cus-prod-fields');
  const avulsoFields = document.getElementById('cus-avulso-fields');
  const meta = document.getElementById('cus-prod-meta');
  const lbl  = document.getElementById('cus-qtd-lbl');
  const tv   = document.getElementById('cus-total-val');
  if(meta) meta.textContent = `${d.selCat} › ${d.selSub} · unid.: ${d.selUn}`;
  if(lbl)  lbl.textContent  = `Qtd (${d.selUn})`;
  if(prodFields)   prodFields.style.display   = 'block';
  if(avulsoFields) avulsoFields.style.display = 'none';
  if(tv) tv.textContent = 'R$ 0,00';
}

function limparProdSearch() {
  const hidden = document.getElementById('cus-prod');
  const search = document.getElementById('cus-prod-search');
  const res    = document.getElementById('cus-prod-results');
  const clr    = document.getElementById('cus-prod-clear');
  if(hidden) hidden.value = '';
  if(search) { search.value = ''; search.readOnly = false; search.focus(); }
  if(res)  res.style.display = 'none';
  if(clr)  clr.style.display = 'none';
  const prodFields   = document.getElementById('cus-prod-fields');
  const avulsoFields = document.getElementById('cus-avulso-fields');
  if(prodFields)   prodFields.style.display   = 'none';
  if(avulsoFields) avulsoFields.style.display = 'block';
}

function updateCusTotalProd() {
  const qtd = +document.getElementById('cus-qtd')?.value||0;
  const pu  = +document.getElementById('cus-precounit')?.value||0;
  const el  = document.getElementById('cus-total-val');
  if(el) el.textContent = fmt$(qtd*pu);
}

function updateEditCusTotalProd() {
  const qtd = +document.getElementById('ec-cus-qtd')?.value||0;
  const pu  = +document.getElementById('ec-cus-precounit')?.value||0;

function confirmar(msg, onSim) {
  const div = document.createElement('div');
  div.className = 'confirm-overlay';
  div.innerHTML = `<div class="confirm-box">
    <div class="confirm-msg">${msg}</div>
    <div class="confirm-btns">
      <button class="btn btn-ghost" id="conf-nao">Cancelar</button>
      <button class="btn btn-red" id="conf-sim">Excluir</button>
    </div>
  </div>`;
  document.body.appendChild(div);
  div.querySelector('#conf-nao').addEventListener('click', ()=>div.remove());
  div.querySelector('#conf-sim').addEventListener('click', ()=>{ div.remove(); onSim(); });
}

// ─── Update helpers ───────────────────────────────────────────────────────────
function updateColPreview() {
  const g = id => +document.getElementById(id)?.value||0;
  const rec = g('merc-g-q')*g('merc-g-p') + g('cea-g-q')*g('cea-g-p') + g('cea-m-q')*g('cea-m-p') + g('cea-mi-q')*g('cea-mi-p');
  const cx  = g('merc-g-q')+g('cea-g-q')+g('cea-m-q')+g('cea-mi-q');
  const prev = document.getElementById('col-preview');
  if(!prev) return;
  if(cx>0){ prev.style.display='block'; document.getElementById('col-preview-cx').textContent=cx+' caixas'; document.getElementById('col-preview-rec').textContent=fmt$(rec); }
  else { prev.style.display='none'; }
}

// ─── Salvar / Atualizar ───────────────────────────────────────────────────────
async function salvarEditCus() {
  const c = S.custos.find(x=>x.id===S.modalData.cusId)||{};
  const data = document.getElementById('ec-cus-data')?.value;
  if(!data) return;

  let updates;
  if(c.produtoId) {
    const qtd = +document.getElementById('ec-cus-qtd')?.value;
    const precoUnit = +document.getElementById('ec-cus-precounit')?.value;
    if(!qtd||!precoUnit) return;
    updates = { data, qtd, precoUnit, valor: qtd*precoUnit };
  } else {
    const val  = +document.getElementById('ec-cus-val')?.value;
    const desc = document.getElementById('ec-cus-desc')?.value;
    if(!val||!desc) return;
    updates = {
      data,
      categoria:   document.getElementById('ec-cus-cat')?.value,
      subcategoria:document.getElementById('ec-cus-subcat')?.value||'',
      descricao:   desc,
      valor:       val,
    };
  }
  const id = S.modalData.cusId;
  S.modal=null; render();
  await updateDoc(doc(db,'custos',id), updates);
}

async function salvarEditCol() {
  const g = id => +document.getElementById(id)?.value||0;
  const data = document.getElementById('ec-data')?.value;
  if(!data) return;
  const status = document.querySelector('input[name="ec-col-status"]:checked')?.value||'pago';
  const updates = {
    data, status,
    merc_g_q:g('ec-merc-g-q'), merc_g_p:g('ec-merc-g-p'),
    cea_g_q:g('ec-cea-g-q'),   cea_g_p:g('ec-cea-g-p'),
    cea_m_q:g('ec-cea-m-q'),   cea_m_p:g('ec-cea-m-p'),
    cea_mi_q:g('ec-cea-mi-q'), cea_mi_p:g('ec-cea-mi-p'),
  };
  const id = S.modalData.colId;
  S.modal=null; render();
  await updateDoc(doc(db,'colheitas',id), updates);
}

async function salvarColheita() {
  const g = id => +document.getElementById(id)?.value||0;
  const data = document.getElementById('col-data')?.value;
  if(!data) return;
  const status = document.querySelector('input[name="col-status"]:checked')?.value||'pago';
  const entry = {
    data, status, createdAt: serverTimestamp(),
    merc_g_q:g('merc-g-q'), merc_g_p:g('merc-g-p'),
    cea_g_q:g('cea-g-q'),   cea_g_p:g('cea-g-p'),
    cea_m_q:g('cea-m-q'),   cea_m_p:g('cea-m-p'),
    cea_mi_q:g('cea-mi-q'), cea_mi_p:g('cea-mi-p'),
  };
  const btn = document.getElementById('btn-salvar-col');
  btn.textContent='Salvando...'; btn.disabled=true;
  await addDoc(collection(db,'colheitas'),entry);
  btn.textContent='✓ Salvo!';
  setTimeout(()=>{ btn.textContent='Registrar Colheita'; btn.disabled=false; },2000);
  ['merc-g-q','merc-g-p','cea-g-q','cea-g-p','cea-m-q','cea-m-p','cea-mi-q','cea-mi-p']
    .forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });

async function salvarCusto() {
  const dataBase = document.getElementById('cus-data')?.value;
  if(!dataBase) return;

  const prodSel = document.getElementById('cus-prod');
  const usandoProd = prodSel && prodSel.value;

  let baseDoc;

  if(usandoProd) {
    const qtd       = +document.getElementById('cus-qtd')?.value;
    const precoUnit = +document.getElementById('cus-precounit')?.value;
    if(!qtd||!precoUnit) return;
    const prod = S.produtos.find(p=>p.id===prodSel.value);
    baseDoc = {
      produtoId:      prodSel.value,
      nomeProduto:    prod?.nome||'',
      unidadeProduto: prod?.unidade||'',
      categoria:      prod?.categoria||'',
      subcategoria:   prod?.subcategoria||'',
      qtd, precoUnit,
      valor: qtd*precoUnit,
    };
  } else {
    const val  = +document.getElementById('cus-val')?.value;
    const desc = document.getElementById('cus-desc')?.value;
    if(!val||!desc) return;
    baseDoc = {
      descricao:   desc,
      categoria:   document.getElementById('cus-cat')?.value,
      subcategoria:document.getElementById('cus-subcat')?.value||'',
      valor: val,
    };
  }

  const repetir   = document.getElementById('cus-repetir')?.value||'nao';
  const nParcelas = +document.getElementById('cus-parcelas')?.value||1;

  const btn = document.getElementById('btn-salvar-cus');
  btn.textContent='Salvando...'; btn.disabled=true;

  const addMeses = (dataStr, n) => {
    const [y,m,d] = dataStr.split('-').map(Number);
    let mm=m+n, yy=y;
    while(mm>12){mm-=12;yy++;}
    return `${yy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  };

  if(repetir==='nao') {
    await addDoc(collection(db,'custos'),{...baseDoc,data:dataBase,repetir:'nao',createdAt:serverTimestamp()});
  } else if(repetir==='quinzenal') {
    const [y,m,d] = dataBase.split('-').map(Number);
    let dt = new Date(Date.UTC(y,m-1,d));
    for(let i=0;i<12;i++){
      const s = dt.toISOString().slice(0,10);
      await addDoc(collection(db,'custos'),{...baseDoc,data:s,repetir:'quinzenal',parcelaNum:i+1,parcelasTotal:12,createdAt:serverTimestamp()});
      dt = new Date(dt.getTime() + 15*864e5);
    }
  } else if(repetir==='mensal') {
    for(let i=0;i<12;i++) await addDoc(collection(db,'custos'),{...baseDoc,data:addMeses(dataBase,i),repetir:'mensal',parcelaNum:i+1,parcelasTotal:12,createdAt:serverTimestamp()});
  } else if(repetir==='parcelado') {
    for(let i=0;i<nParcelas;i++) await addDoc(collection(db,'custos'),{...baseDoc,data:addMeses(dataBase,i),repetir:'parcelado',parcelaNum:i+1,parcelasTotal:nParcelas,createdAt:serverTimestamp()});
  }

  btn.textContent='✓ Salvo!';
  setTimeout(()=>{ btn.textContent='Registrar Custo'; btn.disabled=false; },2000);

  // reset form
  if(usandoProd) {
    if(prodSel) prodSel.value='';
    ['cus-qtd','cus-precounit'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    const tv = document.getElementById('cus-total-val');
    if(tv) tv.textContent='R$ 0,00';
    const pf = document.getElementById('cus-prod-fields');
    const af = document.getElementById('cus-avulso-fields');
    if(pf) pf.style.display='none';
    if(af) af.style.display='block';
  } else {
    const v = document.getElementById('cus-val'); if(v) v.value='';
    const d = document.getElementById('cus-desc'); if(d) d.value='';
  }
  if(document.getElementById('cus-repetir')) document.getElementById('cus-repetir').value='nao';
  if(document.getElementById('cus-parcelas-box')) document.getElementById('cus-parcelas-box').style.display='none';
}

async function criarCiclo() {

  const variedade    = document.getElementById('m-variedade')?.value||'';
  const semeio       = document.getElementById('m-semeio')?.value||null;
  const qtdMudas     = +document.getElementById('m-qtd-mudas')?.value||null;
  const espacamento  = document.getElementById('m-espacamento')?.value||'';
  const tipoMuda     = document.querySelector('input[name="m-tipo-muda"]:checked')?.value||'pe-franco';
  const portaEnxerto = tipoMuda==='porta-enxerto'?(document.getElementById('m-pe-qual')?.value||''):'';
  const obs          = document.getElementById('m-obs')?.value||'';
  // Fertig params
  const metaKgPe    = +document.getElementById('m-meta-kgpe')?.value||10;
  const eficN       = +document.getElementById('m-efic-n')?.value||80;
  const eficP       = +document.getElementById('m-efic-p')?.value||40;

  const eficCa      = +document.getElementById('m-efic-ca')?.value||50;

  const pctCaFertig = +document.getElementById('m-pct-ca-fertig')?.value||25;
  S.modal=null; render();
  const anterior = cicloAtivo(estufa);
  if(anterior) await updateDoc(doc(db,'ciclos',anterior.id),{encerrado:true, encerradoEm:today()});
  await addDoc(collection(db,'ciclos'),{
    estufa, plantio, variedade, semeio, qtdMudas, espacamento,
    tipoMuda, portaEnxerto, obs,
    metaKgPe, eficN, eficP, eficK, eficCa, eficMg, pctCaFertig,
    encerrado: false,
    primeiraColheita: null,
    ultimaColheita: null,

}

// ─── PIN Lock ────────────────────────────────────────────────────────────────
const PIN = '2908';
const PIN_KEY = 'estufa-pin-ok';

function checkPin() {
  return localStorage.getItem(PIN_KEY) === '1';
}

function renderPin(erro) {
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:32px">
      <div style="font-size:20px;font-weight:500;color:var(--green);letter-spacing:.15em;margin-bottom:4px">ESTUFA</div>
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;margin-bottom:40px">Gestão da Operação</div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:280px">
        <div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px;text-transform:uppercase;letter-spacing:.1em">Digite o PIN</div>
        <input type="password" inputmode="numeric" id="pin-input" maxlength="4"
          style="text-align:center;font-size:28px;letter-spacing:.3em;padding:12px;margin-bottom:${erro?'8':'16'}px"
          placeholder="····" autofocus>
        ${erro?'<div style="font-size:11px;color:var(--red);text-align:center;margin-bottom:12px">PIN incorreto</div>':''}
        <button class="btn btn-green" id="btn-pin">Entrar</button>
      </div>
    </div>`;
  const input = document.getElementById('pin-input');
  const btn   = document.getElementById('btn-pin');
  const tentar = () => {
    if(input.value === PIN){ localStorage.setItem(PIN_KEY,'1'); initApp(); }
    else { input.value=''; renderPin(true); }
  };
  btn.addEventListener('click', tentar);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tentar(); });
}

function initApp() {
  S.ready = false;
  render();
  startListeners();
}

// ─── Firebase listeners ───────────────────────────────────────────────────────
let readyCount = 0;
function checkReady() { readyCount++; if(readyCount>=5){ S.ready=true; render(); } }

function startListeners() {
  readyCount = 0;
  onSnapshot(query(collection(db,'ciclos'),     orderBy('createdAt','desc')), snap=>{ S.ciclos     =snap.docs.map(d=>({id:d.id,...d.data()})); checkReady(); render(); });
  onSnapshot(query(collection(db,'colheitas'),  orderBy('data','desc')),      snap=>{ S.colheitas  =snap.docs.map(d=>({id:d.id,...d.data()})); checkReady(); render(); });
  onSnapshot(query(collection(db,'custos'),     orderBy('data','desc')),      snap=>{ S.custos     =snap.docs.map(d=>({id:d.id,...d.data()})); checkReady(); render(); });
  onSnapshot(query(collection(db,'ocorrencias'),orderBy('data','desc')),      snap=>{ S.ocorrencias=snap.docs.map(d=>({id:d.id,...d.data()})); checkReady(); render(); });
  onSnapshot(query(collection(db,'produtos'),   orderBy('createdAt','desc')), snap=>{ S.produtos   =snap.docs.map(d=>({id:d.id,...d.data()})); checkReady(); render(); });
}

// Boot
if(checkPin()) { initApp(); } else { renderPin(false); }
</script>
