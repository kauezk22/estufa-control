<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Estufa · Controle</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a160a;--surface:#112011;--surface2:#162816;
  --border:#1a3a1a;--green:#4ade80;--greenD:#86efac;
  --amber:#fbbf24;--orange:#fb923c;--blue:#60a5fa;
  --red:#ef4444;--text:#d1fae5;--muted:#4b5563;--white:#fff;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:14px}
#app{min-height:100vh;display:flex;flex-direction:column}
.header{position:sticky;top:0;z-index:100;background:#0d1a0d;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:15px;font-weight:500;color:var(--green);letter-spacing:.12em}
.header-sub{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em}
.header-date{font-size:10px;color:var(--muted)}
.content{flex:1;padding-bottom:64px;overflow-y:auto}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0d1a0d;border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;padding:10px 0;background:transparent;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);border-top:2px solid transparent;text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s}
.nav-btn.active{color:var(--green);border-top-color:var(--green)}
.nav-icon{font-size:16px}
.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.card-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.metric-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.metric-val{font-size:15px;font-weight:500;line-height:1}
.metric-sub{font-size:9px;color:var(--muted);margin-top:3px}
label.lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px}
input,select,textarea{background:#080e08;border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);width:100%;font-family:'DM Mono',monospace;font-size:13px;outline:none;transition:border-color .15s;appearance:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:#166534}
select option{background:#0a160a}
textarea{resize:vertical;min-height:60px}
.btn{border:none;border-radius:8px;padding:11px 16px;cursor:pointer;font-family:'DM Mono',monospace;font-weight:500;font-size:13px;width:100%;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-blue{background:#2563eb;color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-sm{padding:5px 10px;font-size:11px;width:auto;border-radius:6px}
.btn-danger{background:#3b0000;color:#fca5a5;border:none;border-radius:6px;padding:5px 9px;cursor:pointer;font-size:11px;font-family:'DM Mono',monospace}
.section-box{border-radius:10px;padding:12px;margin-bottom:10px}
.section-merc{border:1px solid #60a5fa33;background:#60a5fa08}
.section-ceasa{border:1px solid #fbbf2433;background:#fbbf2408}
.badge{display:inline-block;font-size:9px;border-radius:4px;padding:2px 6px;white-space:nowrap}
.divider{height:1px;background:var(--border);margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row-item{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.tag{font-size:9px;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
/* modal */
.overlay{position:fixed;inset:0;background:#000000cc;z-index:200;display:flex;align-items:flex-end}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px 32px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:16px}
.modal-close{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;float:right;margin-top:-2px}
/* charts */
.bar-wrap{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.bar{border-radius:3px 3px 0 0;width:100%;min-height:2px;transition:height .3s}
.bar-label{font-size:8px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.progress-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:3px}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
/* estufa card */
.estufa-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.estufa-num{font-size:10px;color:var(--muted);margin-bottom:2px}
.estufa-dias{font-size:26px;font-weight:500;line-height:1.1}
.estufa-unit{font-size:9px;color:var(--muted)}
/* ocorrencias */
.occ-item{padding:10px 0;border-bottom:1px solid var(--border)}
.occ-item:last-child{border-bottom:none}
.severity-leve{color:#86efac}
.severity-moderada{color:#fbbf24}
.severity-grave{color:#ef4444}
/* loading */
.loading{height:100vh;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:13px}
.empty{text-align:center;padding:32px;color:var(--muted);font-size:12px;line-height:1.8}
input[type=number]::-webkit-inner-spin-button{opacity:.3}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#1e3a1e;border-radius:2px}
</style>
</head>
<body>
<div id="app"><div class="loading">carregando...</div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc,
  doc, onSnapshot, query, orderBy, serverTimestamp, Timestamp
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ─── Firebase Config ──────────────────────────────────────────────────────────
const app = initializeApp({
  apiKey: "AIzaSyD5O_BKJW3gAne5uxGxvLffGnuY0tpH-hU",
  authDomain: "estufa-control.firebaseapp.com",
  projectId: "estufa-control",
  storageBucket: "estufa-control.firebasestorage.app",
  messagingSenderId: "1034393767324",
  appId: "1:1034393767324:web:0153fd2de071ed77004c59"
});
const db = getFirestore(app);

// ─── Constants ────────────────────────────────────────────────────────────────
const N_ESTUFAS = 6;
const CAT_INSUMOS = [
  'Mudas','Esterco','Condicionador de Solo','Gesso Agrícola','Calcário',
  'Fertilizantes Sais','Fertilizantes Orgânicos','Fertilizantes Foliares',
  'Inseticidas','Herbicidas','Fungicidas','Nematicidas','Nematicida Biológico',
  'Adjuvantes/Espalhantes','Fitilhos','EPIs','Gasolina e Óleo 2T',
  'Manutenção Estufas','Manutenção Equipamentos','Energia','Mão de Obra','Outros'
];
const TIPOS_OCC = ['Doença','Praga','Deficiência Nutricional','Problema Estrutural','Outro'];
const SEV = ['leve','moderada','grave'];

// ─── State ────────────────────────────────────────────────────────────────────
const S = {
  tab: 'painel',
  modal: null,
  modalData: {},
  ciclos: [],
  colheitas: [],
  custos: [],
  ocorrencias: [],
  ready: false,
};

// ─── Helpers ──────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,9);
const today = () => new Date().toISOString().slice(0,10);
const fmt$ = n => (+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const fmtD = s => s ? s.slice(0,10).split('-').reverse().join('/') : '—';
const fmtMes = s => { const [y,m]=s.split('-'); const ms=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return ms[+m-1]+'/'+y.slice(2); };
const diasEntre = (a,b) => Math.round((new Date(b)-new Date(a))/864e5);
const diasDesde = s => { if(!s)return null; return diasEntre(s, today()); };
const mesDe = s => s ? s.slice(0,7) : '';
const mesAtual = () => today().slice(0,7);

function getFase(dias) {
  if(dias===null) return {label:'Sem ciclo',color:'var(--muted)',ring:'var(--border)'};
  if(dias<0)      return {label:'Futuro',   color:'#818cf8',ring:'#3730a3'};
  if(dias<=20)    return {label:'Muda',     color:'var(--amber)',ring:'#92400e'};
  if(dias<=60)    return {label:'Crescimento',color:'var(--greenD)',ring:'#14532d'};
  if(dias<=100)   return {label:'Produção', color:'var(--green)',ring:'#166534'};
  return               {label:'Col. Final', color:'var(--orange)',ring:'#7c2d12'};
}

const recMerc  = c => (c.merc_g_q||0)*(c.merc_g_p||0);
const recCeasa = c => (c.cea_g_q||0)*(c.cea_g_p||0)+(c.cea_m_q||0)*(c.cea_m_p||0)+(c.cea_mi_q||0)*(c.cea_mi_p||0);
const recTotal = c => recMerc(c)+recCeasa(c);
const cxTotal  = c => (c.merc_g_q||0)+(c.cea_g_q||0)+(c.cea_m_q||0)+(c.cea_mi_q||0);

function cicloAtivo(estufa) {
  return S.ciclos.find(c=>c.estufa===estufa && !c.encerrado) || null;
}

function ocorrenciasDosCiclos(ids) {
  return S.ocorrencias.filter(o=>ids.includes(o.cicloId));
}

// ─── Render engine ────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('app');
  if(!S.ready){ root.innerHTML='<div class="loading">carregando...</div>'; return; }
  root.innerHTML = `
    ${renderHeader()}
    <div class="content">${renderContent()}</div>
    ${renderNav()}
    ${S.modal ? renderModal() : ''}
  `;
  attachEvents();
}

function renderHeader() {
  const d = new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
  return `<div class="header">
    <div><div class="header-title">ESTUFA</div><div class="header-sub">Controle Financeiro</div></div>
    <div class="header-date">${d}</div>
  </div>`;
}

function renderNav() {
  const tabs = [
    {id:'painel',icon:'◉',label:'Painel'},
    {id:'colheita',icon:'⬡',label:'Colheita'},
    {id:'custos',icon:'◈',label:'Custos'},
    {id:'estufas',icon:'⬜',label:'Estufas'},
    {id:'analises',icon:'◧',label:'Análises'},
  ];
  return `<nav class="nav">${tabs.map(t=>`
    <button class="nav-btn${S.tab===t.id?' active':''}" data-tab="${t.id}">
      <span class="nav-icon">${t.icon}</span>${t.label}
    </button>`).join('')}</nav>`;
}

function renderContent() {
  switch(S.tab) {
    case 'painel':   return renderPainel();
    case 'colheita': return renderColheita();
    case 'custos':   return renderCustos();
    case 'estufas':  return renderEstufas();
    case 'analises': return renderAnalises();
    default:         return '';
  }
}

// ─── PAINEL ──────────────────────────────────────────────────────────────────
function renderPainel() {
  const mes = mesAtual();
  const colMes = S.colheitas.filter(c=>mesDe(c.data)===mes);
  const cusMes = S.custos.filter(c=>mesDe(c.data)===mes);
  const recM   = colMes.reduce((a,c)=>a+recMerc(c),0);
  const recC   = colMes.reduce((a,c)=>a+recCeasa(c),0);
  const rec    = recM+recC;
  const cus    = cusMes.reduce((a,c)=>a+c.valor,0);
  const res    = rec-cus;
  const mar    = rec>0?(res/rec*100):0;

  const tMG  = colMes.reduce((a,c)=>a+(c.merc_g_q||0),0);
  const tCG  = colMes.reduce((a,c)=>a+(c.cea_g_q||0),0);
  const tCM  = colMes.reduce((a,c)=>a+(c.cea_m_q||0),0);
  const tCmi = colMes.reduce((a,c)=>a+(c.cea_mi_q||0),0);

  const ultimasCol = [...S.colheitas].sort((a,b)=>b.data.localeCompare(a.data)).slice(0,5);

  return `<div class="pad">
    <div>
      <div class="card-title">Estufas</div>
      <div class="grid3">${Array.from({length:N_ESTUFAS},(_,i)=>{
        const ci = cicloAtivo(i+1);
        const dias = ci ? diasDesde(ci.plantio) : null;
        const fase = getFase(dias);
        return `<div class="estufa-card" style="border-color:${fase.ring}">
          <div class="estufa-num">Estufa ${i+1}</div>
          <div class="estufa-dias" style="color:${fase.color}">${dias!==null?dias:'—'}</div>
          ${dias!==null?'<div class="estufa-unit">dias</div>':''}
          <div class="badge" style="background:${fase.ring}55;color:${fase.color};margin-top:5px">${fase.label}</div>
          ${ci&&ci.variedade?`<div style="font-size:9px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ci.variedade}</div>`:''}
        </div>`;
      }).join('')}</div>
    </div>

    <div class="grid2">
      ${metric('Receita mês',fmt$(rec),'var(--green)')}
      ${metric('Resultado',fmt$(res),res>=0?'var(--green)':'var(--red)')}
      ${metric('Mercado',fmt$(recM),'var(--blue)',rec>0?`${(recM/rec*100).toFixed(0)}% da receita`:'')}
      ${metric('CEASA',fmt$(recC),'var(--amber)',rec>0?`${(recC/rec*100).toFixed(0)}% da receita`:'')}
      ${metric('Custos mês',fmt$(cus),'var(--orange)')}
      ${metric('Margem',`${mar.toFixed(1)}%`,mar>=0?'var(--green)':'var(--red)')}
    </div>

    <div class="card">
      <div class="card-title">Caixas — Mês Atual</div>
      <div style="margin-bottom:10px">
        <div style="font-size:9px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Supermercado</div>
        <span style="font-size:24px;font-weight:500;color:var(--blue)">${tMG}</span>
        <span style="font-size:10px;color:var(--muted);margin-left:6px">cx Graúdo</span>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px">
        <div style="font-size:9px;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">CEASA</div>
        <div class="grid3" style="text-align:center">
          ${[['Graúdo',tCG,'var(--green)'],['Médio',tCM,'var(--greenD)'],['Miúdo',tCmi,'var(--amber)']].map(([n,v,c])=>`
            <div><div style="font-size:20px;font-weight:500;color:${c}">${v}</div><div style="font-size:9px;color:var(--muted);margin-top:2px">${n}</div></div>`).join('')}
        </div>
      </div>
      <div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px">
        <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Total geral (Mercado + CEASA)</div>
        <div class="grid3" style="text-align:center">
          ${(()=>{ const tot=(tMG+tCG)+tCM+tCmi||1; return [['Graúdo',tMG+tCG,'var(--green)'],['Médio',tCM,'var(--greenD)'],['Miúdo',tCmi,'var(--amber)']].map(([n,v,c])=>`
            <div>
              <div style="font-size:20px;font-weight:500;color:${c}">${v}</div>
              <div style="font-size:10px;color:${c};margin-top:1px">${(v/tot*100).toFixed(0)}%</div>
              <div style="font-size:9px;color:var(--muted);margin-top:1px">${n}</div>
            </div>`).join(''); })()}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Últimas Colheitas</div>
      ${ultimasCol.length===0?'<div class="empty">Nenhuma colheita ainda.</div>':
      ultimasCol.map(c=>`
        <div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:12px;color:var(--text)">${fmtD(c.data)}</div>
          <div style="font-size:13px;color:var(--green);font-weight:500">${fmt$(recTotal(c))}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

function metric(label,val,color,sub='') {
  return `<div class="metric">
    <div class="metric-label">${label}</div>
    <div class="metric-val" style="color:${color}">${val}</div>
    ${sub?`<div class="metric-sub">${sub}</div>`:''}
  </div>`;
}

// ─── COLHEITA ────────────────────────────────────────────────────────────────
function renderColheita() {
  const recentes = [...S.colheitas].sort((a,b)=>b.data.localeCompare(a.data));
  return `<div class="pad">
    <div class="card">
      <div style="font-size:14px;font-weight:500;color:var(--text);margin-bottom:14px">Registrar Colheita</div>
      <div style="margin-bottom:10px">
        <label class="lbl">Data</label>
        <input type="date" id="col-data" value="${today()}">
      </div>

      <div class="section-box section-merc">
        <div style="font-size:11px;font-weight:500;color:var(--blue);margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em">Supermercado</div>
        <div style="display:grid;grid-template-columns:72px 1fr 1fr;gap:8px;align-items:end">
          <div style="font-size:12px;color:var(--green);font-weight:500;padding-bottom:9px">Graúdo</div>
          <div><label class="lbl">Caixas</label><input type="number" min="0" id="merc-g-q" placeholder="0"></div>
          <div><label class="lbl">R$/cx</label><input type="number" min="0" step="0.01" id="merc-g-p" placeholder="0,00"></div>
        </div>
      </div>

      <div class="section-box section-ceasa">
        <div style="font-size:11px;font-weight:500;color:var(--amber);margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em">CEASA</div>
        ${[['Graúdo','var(--green)','cea-g'],['Médio','var(--greenD)','cea-m'],['Miúdo','var(--amber)','cea-mi']].map(([lbl,col,id])=>`
          <div style="display:grid;grid-template-columns:72px 1fr 1fr;gap:8px;align-items:end;margin-bottom:8px">
            <div style="font-size:12px;color:${col};font-weight:500;padding-bottom:9px">${lbl}</div>
            <div><label class="lbl">Caixas</label><input type="number" min="0" id="${id}-q" placeholder="0"></div>
            <div><label class="lbl">R$/cx</label><input type="number" min="0" step="0.01" id="${id}-p" placeholder="0,00"></div>
          </div>`).join('')}
      </div>

      <div id="col-preview" style="display:none;margin-bottom:12px;padding:10px 12px;background:#080e08;border-radius:8px;border:1px solid var(--border)">
        <div style="font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em">Total</div>
        <div class="row">
          <div style="font-size:11px;color:var(--muted)" id="col-preview-cx"></div>
          <div style="font-size:15px;font-weight:500;color:var(--green)" id="col-preview-rec"></div>
        </div>
      </div>

      <button class="btn btn-green" id="btn-salvar-col">Registrar Colheita</button>
    </div>

    <div class="card">
      <div class="card-title">Histórico</div>
      ${recentes.length===0?'<div class="empty">Nenhuma colheita registrada ainda.</div>':
      recentes.map(c=>`
        <div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div class="row" style="margin-bottom:5px">
            <div style="font-size:13px;font-weight:500;color:var(--text)">${fmtD(c.data)}</div>
            <div class="row" style="gap:8px">
              <div style="font-size:14px;color:var(--green);font-weight:500">${fmt$(recTotal(c))}</div>
              <button class="btn-danger" data-del-col="${c.id}">✕</button>
            </div>
          </div>
          ${c.merc_g_q>0?`<div style="font-size:11px;color:var(--blue);margin-bottom:2px">Mercado: ${c.merc_g_q}cx G @ ${fmt$(c.merc_g_p)} = ${fmt$(recMerc(c))}</div>`:''}
          ${(c.cea_g_q>0||c.cea_m_q>0||c.cea_mi_q>0)?`<div style="font-size:11px;color:var(--amber)">CEASA: ${[c.cea_g_q>0&&`${c.cea_g_q}cx G`,c.cea_m_q>0&&`${c.cea_m_q}cx M`,c.cea_mi_q>0&&`${c.cea_mi_q}cx mi`].filter(Boolean).join(' · ')} = ${fmt$(recCeasa(c))}</div>`:''}
        </div>`).join('')}
    </div>
  </div>`;
}

// ─── CUSTOS ──────────────────────────────────────────────────────────────────
function renderCustos() {
  const mes = mesAtual();
  const cusMes = S.custos.filter(c=>mesDe(c.data)===mes);
  const totalMes = cusMes.reduce((a,c)=>a+c.valor,0);
  const porCat = CAT_INSUMOS

    .filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
  const recentes = [...S.custos].sort((a,b)=>b.data.localeCompare(a.data));

  return `<div class="pad">
    <div class="card">

      <button class="btn btn-red" id="btn-salvar-cus">Registrar Custo</button>
    </div>

    ${porCat.length>0?`<div class="card">
      <div class="card-title">Por Categoria — Mês Atual</div>
      <div style="font-size:11px;color:var(--orange);margin-bottom:10px">Total: ${fmt$(totalMes)}</div>
      ${porCat.map(x=>{

            <div style="font-size:12px;color:var(--greenD)">${x.cat}</div>

              <div style="font-size:12px;color:var(--orange);font-weight:500">${fmt$(x.total)}</div>

    <div class="card">
      <div class="card-title">Histórico</div>
      ${recentes.length===0?'<div class="empty">Nenhum custo registrado ainda.</div>':
      recentes.map(c=>`
        <div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;min-width:0;margin-right:8px">
            <div style="font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.descricao||c.categoria}</div>
            <div style="font-size:10px;color:var(--muted)">${fmtD(c.data)} · ${c.categoria}</div>
          </div>
          <div class="row" style="gap:8px;flex-shrink:0">
            <div style="font-size:13px;color:var(--orange);font-weight:500">${fmt$(c.valor)}</div>
            <button class="btn-danger" data-del-cus="${c.id}">✕</button>

  </div>`;
}

// ─── ANÁLISES ────────────────────────────────────────────────────────────────
function renderAnalises() {
  // Agrupa por mês
  const meses = [...new Set([...S.colheitas.map(c=>mesDe(c.data)),...S.custos.map(c=>mesDe(c.data))].filter(Boolean))].sort().slice(-6);

  const dadosMeses = meses.map(m=>({
    mes:m,
    rec:S.colheitas.filter(c=>mesDe(c.data)===m).reduce((a,c)=>a+recTotal(c),0),
    recM:S.colheitas.filter(c=>mesDe(c.data)===m).reduce((a,c)=>a+recMerc(c),0),
    recC:S.colheitas.filter(c=>mesDe(c.data)===m).reduce((a,c)=>a+recCeasa(c),0),
    cus:S.custos.filter(c=>mesDe(c.data)===m).reduce((a,c)=>a+c.valor,0),
  }));

  const maxRec = Math.max(...dadosMeses.map(d=>d.rec),1);
  const maxCus = Math.max(...dadosMeses.map(d=>d.cus),1);
  const maxBar = Math.max(maxRec,maxCus);

  // Evolução preço médio por colheita
  const colOrdenadas = [...S.colheitas].sort((a,b)=>a.data.localeCompare(b.data)).slice(-10);

  // Custo acumulado por categoria (últimos 3 meses)
  const m3 = meses.slice(-3);
  const cusCat = CAT_INSUMOS.map(cat=>({
    cat,
    total:S.custos.filter(c=>m3.includes(mesDe(c.data))&&c.categoria===cat).reduce((a,c)=>a+c.valor,0)
  })).filter(x=>x.total>0).sort((a,b)=>b.total-a.total).slice(0,8);
  const maxCat = Math.max(...cusCat.map(x=>x.total),1);

  // Alocação por estufa-dias
  const alocacao = calcAlocacao();

  const totalAnual = {
    rec: S.colheitas.reduce((a,c)=>a+recTotal(c),0),
    cus: S.custos.reduce((a,c)=>a+c.valor,0),
  };

  return `<div class="pad">
    <!-- Resultado anual -->
    <div class="card">
      <div class="card-title">Resultado Acumulado</div>
      <div class="grid2">
        ${metric('Receita total',fmt$(totalAnual.rec),'var(--green)')}
        ${metric('Custos totais',fmt$(totalAnual.cus),'var(--orange)')}
        ${metric('Resultado',fmt$(totalAnual.rec-totalAnual.cus),(totalAnual.rec-totalAnual.cus)>=0?'var(--green)':'var(--red)')}
        ${metric('Margem geral',totalAnual.rec>0?`${((totalAnual.rec-totalAnual.cus)/totalAnual.rec*100).toFixed(1)}%`:'—',totalAnual.rec>0&&(totalAnual.rec-totalAnual.cus)>=0?'var(--green)':'var(--red)')}
      </div>
    </div>

    <!-- Receita vs Custo por mês -->
    ${dadosMeses.length>0?`<div class="card">
      <div class="card-title">Receita × Custo (últimos 6 meses)</div>
      <div style="display:flex;gap:12px;font-size:9px;color:var(--muted);margin-bottom:8px">
        <span style="color:var(--green)">█ Receita</span>
        <span style="color:var(--orange)">█ Custo</span>
      </div>
      <div class="bar-wrap">
        ${dadosMeses.map(d=>`<div class="bar-col">
          <div class="bar" style="height:${(d.rec/maxBar*70)}px;background:var(--green)"></div>
          <div class="bar" style="height:${(d.cus/maxBar*70)}px;background:var(--orange)"></div>
          <div class="bar-label">${fmtMes(d.mes)}</div>
        </div>`).join('')}
      </div>
      <div style="margin-top:12px">
        ${dadosMeses.map(d=>`
          <div class="row" style="padding:5px 0;border-bottom:1px solid var(--border);font-size:11px">
            <div style="color:var(--muted)">${fmtMes(d.mes)}</div>
            <div style="color:var(--green)">${fmt$(d.rec)}</div>
            <div style="color:var(--orange)">${fmt$(d.cus)}</div>
            <div style="color:${d.rec-d.cus>=0?'var(--green)':'var(--red)'}">${fmt$(d.rec-d.cus)}</div>
          </div>`).join('')}
      </div>
    </div>`:'<div class="card"><div class="empty">Sem dados suficientes para análise mensal.</div></div>'}

    <!-- Mercado vs CEASA -->
    ${dadosMeses.length>0?`<div class="card">
      <div class="card-title">Mercado × CEASA por Mês</div>
      <div style="display:flex;gap:12px;font-size:9px;color:var(--muted);margin-bottom:8px">
        <span style="color:var(--blue)">█ Mercado</span>
        <span style="color:var(--amber)">█ CEASA</span>
      </div>
      ${dadosMeses.map(d=>{
        const tot=d.recM+d.recC; if(!tot) return '';
        const pm=tot>0?d.recM/tot*100:0;
        const pc=tot>0?d.recC/tot*100:0;
        return `<div style="margin-bottom:8px">
          <div class="row" style="margin-bottom:3px;font-size:11px">
            <div style="color:var(--muted)">${fmtMes(d.mes)}</div>
            <div style="color:var(--blue)">${fmt$(d.recM)}</div>
            <div style="color:var(--amber)">${fmt$(d.recC)}</div>
          </div>
          <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;display:flex">
            <div style="width:${pm}%;background:var(--blue)"></div>
            <div style="width:${pc}%;background:var(--amber)"></div>
          </div>
        </div>`;
      }).join('')}
    </div>`:''}

    <!-- Custo por categoria -->
    ${cusCat.length>0?`<div class="card">
      <div class="card-title">Custo por Categoria (últimos 3 meses)</div>
      ${cusCat.map(x=>`
        <div style="margin-bottom:8px">
          <div class="row" style="margin-bottom:3px;font-size:11px">
            <div style="color:var(--greenD);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${x.cat}</div>
            <div style="color:var(--orange);flex-shrink:0;margin-left:8px">${fmt$(x.total)}</div>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${x.total/maxCat*100}%;background:var(--orange)"></div></div>
        </div>`).join('')}
    </div>`:''}

    <!-- Evolução preço médio -->
    ${colOrdenadas.length>1?`<div class="card">
      <div class="card-title">Preço Médio por Colheita (últimas 10)</div>
      ${colOrdenadas.filter(c=>c.merc_g_q>0).length>0?`
        <div style="font-size:10px;color:var(--blue);margin-bottom:6px">Mercado — Graúdo</div>
        ${renderLinhaPreco(colOrdenadas.filter(c=>c.merc_g_q>0).map(c=>({d:fmtD(c.data).slice(0,5),v:c.merc_g_p})),'var(--blue)')}
      `:''}
      ${colOrdenadas.filter(c=>c.cea_g_q>0).length>0?`
        <div style="font-size:10px;color:var(--green);margin-top:12px;margin-bottom:6px">CEASA — Graúdo</div>
        ${renderLinhaPreco(colOrdenadas.filter(c=>c.cea_g_q>0).map(c=>({d:fmtD(c.data).slice(0,5),v:c.cea_g_p})),'var(--green)')}
      `:''}
      ${colOrdenadas.filter(c=>c.cea_m_q>0).length>0?`
        <div style="font-size:10px;color:var(--greenD);margin-top:12px;margin-bottom:6px">CEASA — Médio</div>
        ${renderLinhaPreco(colOrdenadas.filter(c=>c.cea_m_q>0).map(c=>({d:fmtD(c.data).slice(0,5),v:c.cea_m_p})),'var(--greenD)')}
      `:''}
    </div>`:''}

    <!-- Produção estimada por estufa -->
    ${alocacao.length>0?`<div class="card">
      <div class="card-title">Produção Estimada por Estufa (estufa-dias)</div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:10px">Baseado em proporção de dias em colheita por ciclo</div>
      ${alocacao.map(x=>`
        <div style="margin-bottom:8px">
          <div class="row" style="margin-bottom:3px;font-size:11px">
            <div style="color:var(--greenD)">Estufa ${x.estufa}</div>
            <div style="color:var(--green)">${x.caixas.toFixed(0)} cx (${x.pct.toFixed(0)}%)</div>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${x.pct}%;background:var(--green)"></div></div>
        </div>`).join('')}
    </div>`:''}
  </div>`;
}

function renderLinhaPreco(pts, color) {
  if(pts.length<2) return `<div style="font-size:10px;color:var(--muted)">Dados insuficientes</div>`;
  const max=Math.max(...pts.map(p=>p.v));
  const min=Math.min(...pts.map(p=>p.v));
  const range=max-min||1;
  const w=300,h=50,pad=10;
  const x=i=>(i/(pts.length-1))*(w-2*pad)+pad;
  const y=v=>h-pad-((v-min)/range)*(h-2*pad);
  const path=pts.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  return `<div style="overflow-x:auto">
    <svg width="${w}" height="${h}" style="display:block">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
      ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="${color}"/>
        <text x="${x(i).toFixed(1)}" y="${h}" text-anchor="middle" fill="#4b5563" font-size="8" font-family="DM Mono">${p.d}</text>
        <text x="${x(i).toFixed(1)}" y="${(y(p.v)-6).toFixed(1)}" text-anchor="middle" fill="${color}" font-size="8" font-family="DM Mono">${fmt$(p.v).replace('R$\u00a0','')}</text>`).join('')}
    </svg>
  </div>`;
}

function calcAlocacao() {
  const colheitas = S.colheitas;
  if(colheitas.length===0) return [];
  const estufaDias = {};
  S.ciclos.forEach(ci=>{
    if(!ci.primeiraColheita) return;
    const fim = ci.ultimaColheita || ci.encerradoEm || today();
    const dias = Math.max(1, diasEntre(ci.primeiraColheita, fim));
    estufaDias[ci.estufa] = (estufaDias[ci.estufa]||0) + dias;
  });
  const totalDias = Object.values(estufaDias).reduce((a,v)=>a+v,0);
  if(!totalDias) return [];
  const totalCx = colheitas.reduce((a,c)=>a+cxTotal(c),0);
  return Object.entries(estufaDias)
    .map(([e,d])=>({estufa:+e,dias:d,pct:d/totalDias*100,caixas:totalCx*d/totalDias}))
    .sort((a,b)=>b.caixas-a.caixas);
}

// ─── Events ──────────────────────────────────────────────────────────────────
function attachEvents() {
  // nav
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click',()=>{ S.tab=btn.dataset.tab; render(); });
  });

  // close modal
  const ov = document.getElementById('modal-overlay');
  if(ov) ov.addEventListener('click',e=>{ if(e.target===ov||e.target.dataset.closeModal!==undefined){ S.modal=null; render(); }});

  // colheita preview
  const colInputs = ['merc-g-q','merc-g-p','cea-g-q','cea-g-p','cea-m-q','cea-m-p','cea-mi-q','cea-mi-p'];
  colInputs.forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input',updateColPreview); });

  // salvar colheita
  const btnCol = document.getElementById('btn-salvar-col');
  if(btnCol) btnCol.addEventListener('click', salvarColheita);

  // salvar custo
  const btnCus = document.getElementById('btn-salvar-cus');
  if(btnCus) btnCus.addEventListener('click', salvarCusto);

  // novo ciclo buttons
  document.querySelectorAll('[data-novo-ciclo]').forEach(btn=>{
    btn.addEventListener('click',()=>{ S.modal='novo-ciclo'; S.modalData={estufa:+btn.dataset.novoCiclo}; render(); });
  });

  // encerrar ciclo
  document.querySelectorAll('[data-encerrar]').forEach(btn=>{
    btn.addEventListener('click',()=>{ S.modal='encerrar'; S.modalData={cicloId:btn.dataset.encerrar}; render(); });
  });

  // nova ocorrencia
  document.querySelectorAll('[data-nova-occ]').forEach(btn=>{
    btn.addEventListener('click',()=>{ S.modal='nova-occ'; S.modalData={cicloId:btn.dataset.novaOcc, estufa:+btn.dataset.occEstufa}; render(); });
  });

  // modal actions
  const btnCriarCiclo = document.getElementById('btn-criar-ciclo');
  if(btnCriarCiclo) btnCriarCiclo.addEventListener('click', criarCiclo);

  const btnEncerrar = document.getElementById('btn-confirmar-encerrar');
  if(btnEncerrar) btnEncerrar.addEventListener('click', encerrarCiclo);

  const btnOcc = document.getElementById('btn-salvar-occ');
  if(btnOcc) btnOcc.addEventListener('click', salvarOcorrencia);

  // deletar ciclo do histórico
  document.querySelectorAll('[data-del-ciclo]').forEach(btn=>{
    btn.addEventListener('click',()=>deleteDoc(doc(db,'ciclos',btn.dataset.delCiclo)));
  });

  // editar campos do ciclo (1ª colheita, última colheita)
  document.querySelectorAll('[data-ciclo-field]').forEach(input=>{
    input.addEventListener('change', async ()=>{
      const cicloId = input.dataset.cicloField;
      const field   = input.dataset.field;
      await updateDoc(doc(db,'ciclos',cicloId),{[field]: input.value||null});
    });
  });

  // deletar colheita
  document.querySelectorAll('[data-del-col]').forEach(btn=>{
    btn.addEventListener('click',()=>deleteDoc(doc(db,'colheitas',btn.dataset.delCol)));
  });

  // deletar custo
  document.querySelectorAll('[data-del-cus]').forEach(btn=>{
    btn.addEventListener('click',()=>deleteDoc(doc(db,'custos',btn.dataset.delCus)));
  });
}

function updateColPreview() {
  const g = id => +document.getElementById(id)?.value||0;
  const rec = g('merc-g-q')*g('merc-g-p') + g('cea-g-q')*g('cea-g-p') + g('cea-m-q')*g('cea-m-p') + g('cea-mi-q')*g('cea-mi-p');
  const cx  = g('merc-g-q')+g('cea-g-q')+g('cea-m-q')+g('cea-mi-q');
  const prev = document.getElementById('col-preview');
  if(!prev) return;
  if(cx>0){ prev.style.display='block'; document.getElementById('col-preview-cx').textContent=cx+' caixas'; document.getElementById('col-preview-rec').textContent=fmt$(rec); }
  else { prev.style.display='none'; }
}

async function salvarColheita() {
  const g = id => +document.getElementById(id)?.value||0;
  const data = document.getElementById('col-data')?.value;
  if(!data) return;
  const entry = {
    data, createdAt: serverTimestamp(),
    merc_g_q:g('merc-g-q'), merc_g_p:g('merc-g-p'),
    cea_g_q:g('cea-g-q'),   cea_g_p:g('cea-g-p'),
    cea_m_q:g('cea-m-q'),   cea_m_p:g('cea-m-p'),
    cea_mi_q:g('cea-mi-q'), cea_mi_p:g('cea-mi-p'),
  };
  const btn = document.getElementById('btn-salvar-col');
  btn.textContent='Salvando...'; btn.disabled=true;
  await addDoc(collection(db,'colheitas'),entry);
  btn.textContent='✓ Salvo!';
  setTimeout(()=>{ btn.textContent='Registrar Colheita'; btn.disabled=false; },2000);
  // reset fields
  ['merc-g-q','merc-g-p','cea-g-q','cea-g-p','cea-m-q','cea-m-p','cea-mi-q','cea-mi-p']
    .forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('col-preview').style.display='none';
}

async function salvarCusto() {
  const val = +document.getElementById('cus-val')?.value;
  if(!val) return;
  const entry = {
    data: document.getElementById('cus-data')?.value,
    categoria: document.getElementById('cus-cat')?.value,
    descricao: document.getElementById('cus-desc')?.value||'',
    valor: val,
    createdAt: serverTimestamp(),
  };
  const btn = document.getElementById('btn-salvar-cus');
  btn.textContent='Salvando...'; btn.disabled=true;
  await addDoc(collection(db,'custos'),entry);
  btn.textContent='✓ Salvo!';
  setTimeout(()=>{ btn.textContent='Registrar Custo'; btn.disabled=false; },2000);
  document.getElementById('cus-val').value='';
  document.getElementById('cus-desc').value='';
}

async function criarCiclo() {
  const plantio = document.getElementById('m-plantio')?.value;
  if(!plantio) return;
  const estufa = S.modalData.estufa;
  // Encerrar ciclo anterior se existir
  const anterior = cicloAtivo(estufa);
  if(anterior) await updateDoc(doc(db,'ciclos',anterior.id),{encerrado:true, encerradoEm:today()});
  await addDoc(collection(db,'ciclos'),{
    estufa, plantio,
    variedade: document.getElementById('m-variedade')?.value||'',
    origemMudas: document.getElementById('m-origem')?.value||'',
    obs: document.getElementById('m-obs')?.value||'',
    encerrado: false,
    primeiraColheita: null,
    ultimaColheita: null,
    createdAt: serverTimestamp(),
  });
  S.modal=null; render();
}

async function encerrarCiclo() {
  const cicloId = S.modalData.cicloId;
  const ultimaCol = document.getElementById('m-ultima-col')?.value;
  const totalCx = +document.getElementById('m-total-cx')?.value||0;
  const obs = document.getElementById('m-enc-obs')?.value||'';
  await updateDoc(doc(db,'ciclos',cicloId),{
    encerrado:true, encerradoEm:today(),
    ultimaColheita:ultimaCol||today(),
    totalCaixas:totalCx, obs,
  });
  S.modal=null; render();
}

async function salvarOcorrencia() {
  const desc = document.getElementById('m-occ-desc')?.value;
  if(!desc) return;
  const sev = document.querySelector('input[name="m-occ-sev"]:checked')?.value||'leve';
  await addDoc(collection(db,'ocorrencias'),{
    cicloId: S.modalData.cicloId,
    estufa: S.modalData.estufa,
    data: document.getElementById('m-occ-data')?.value,
    tipo: document.getElementById('m-occ-tipo')?.value,
    descricao: desc,
    severidade: sev,
    produto: document.getElementById('m-occ-prod')?.value||'',
    dose: document.getElementById('m-occ-dose')?.value||'',
    resolucao: document.getElementById('m-occ-res')?.value||'',
    createdAt: serverTimestamp(),
  });
  S.modal=null; render();
}

// ─── PIN Lock ────────────────────────────────────────────────────────────────
const PIN = '2908';
const PIN_KEY = 'estufa-pin-ok';

function checkPin() {
  return localStorage.getItem(PIN_KEY) === '1';
}

function renderPin(erro) {
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:32px">
      <div style="font-size:20px;font-weight:500;color:var(--green);letter-spacing:.15em;margin-bottom:4px">ESTUFA</div>
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;margin-bottom:40px">Controle Financeiro</div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:280px">
        <div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px;text-transform:uppercase;letter-spacing:.1em">Digite o PIN</div>
        <input type="password" inputmode="numeric" id="pin-input" maxlength="4"
          style="text-align:center;font-size:28px;letter-spacing:.3em;padding:12px;margin-bottom:${erro?'8':'16'}px"
          placeholder="····" autofocus>
        ${erro?'<div style="font-size:11px;color:var(--red);text-align:center;margin-bottom:12px">PIN incorreto</div>':''}
        <button class="btn btn-green" id="btn-pin">Entrar</button>
      </div>
    </div>`;
  const input = document.getElementById('pin-input');
  const btn   = document.getElementById('btn-pin');
  const tentar = () => {
    if(input.value === PIN){ localStorage.setItem(PIN_KEY,'1'); initApp(); }
    else { input.value=''; renderPin(true); }
  };
  btn.addEventListener('click', tentar);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tentar(); });
}

function initApp() {
  S.ready = false;
  render();
  // start listeners
  startListeners();
}

// ─── Firebase listeners ───────────────────────────────────────────────────────
let readyCount = 0;
function checkReady() { readyCount++; if(readyCount>=4){ S.ready=true; render(); } }

function startListeners() {
  readyCount = 0;
  onSnapshot(query(collection(db,'ciclos'),     orderBy('createdAt','desc')), snap=>{ S.ciclos     =snap.docs.map(d=>({id:d.id,...d.data()})); checkReady(); render(); });
  onSnapshot(query(collection(db,'colheitas'),  orderBy('data','desc')),      snap=>{ S.colheitas  =snap.docs.map(d=>({id:d.id,...d.data()})); checkReady(); render(); });
  onSnapshot(query(collection(db,'custos'),     orderBy('data','desc')),      snap=>{ S.custos     =snap.docs.map(d=>({id:d.id,...d.data()})); checkReady(); render(); });
  onSnapshot(query(collection(db,'ocorrencias'),orderBy('data','desc')),      snap=>{ S.ocorrencias=snap.docs.map(d=>({id:d.id,...d.data()})); checkReady(); render(); });
}

// Boot
if(checkPin()) { initApp(); } else { renderPin(false); }
</script>
